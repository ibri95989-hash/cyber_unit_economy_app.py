<title>AZKAR</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">

<style>
  /* ============ ТОКЕНЫ: та же палитра, что и в основном приложении ============ */
  :root {
    color-scheme: light;

    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #f1efe9;
    --surface-3: #e7e4dc;
    --inset: #faf9f6;

    --line: rgb(24 28 26 / 8%);
    --line-strong: rgb(24 28 26 / 14%);

    --ink: #14171a;
    --muted: #55605b;
    --subtle: #7d8884;

    --accent: #0d7a56;
    --accent-hover: #0a6547;
    --accent-soft: #e6f2ec;
    --accent-soft-2: #cfe7dc;
    --on-accent: #ffffff;
    --ring: rgb(13 122 86 / 35%);

    --warn: #9a6207;
    --warn-soft: #faf1de;
    --danger: #a52f2f;
    --danger-soft: #fbeceb;

    --c-emerald: #0d7a56;  --c-emerald-soft: #e6f2ec;
    --c-indigo: #3f4f9e;   --c-indigo-soft: #e9ebf7;
    --c-amber: #96650a;    --c-amber-soft: #faf1de;
    --c-violet: #6a4a99;   --c-violet-soft: #f0eaf8;
    --c-rose: #a6404f;     --c-rose-soft: #fbeaec;
    --c-teal: #0f6f73;     --c-teal-soft: #e3f1f1;
    --c-slate: #4a5560;    --c-slate-soft: #ecedf0;

    --shadow-s: 0 1px 2px rgb(20 23 26 / 5%);
    --shadow-m: 0 2px 8px -2px rgb(20 23 26 / 8%), 0 1px 3px rgb(20 23 26 / 4%);
    --shadow-l: 0 12px 32px -12px rgb(20 23 26 / 18%), 0 2px 8px -4px rgb(20 23 26 / 8%);

    --ar-size: 2rem;
    --ar-lh: 2.15;
    --tr-size: 1.1875rem;
    --nav-h: 4.25rem;
  }

  /* Тёмная тема: сначала системная (если пользователь не выбрал светлую явно)… */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --bg: #0b0d0c;
      --surface: #151917;
      --surface-2: #1c211e;
      --surface-3: #262c29;
      --inset: #101413;
      --line: rgb(255 255 255 / 8%);
      --line-strong: rgb(255 255 255 / 15%);
      --ink: #eceeec;
      --muted: #a0aaa5;
      --subtle: #7c8681;
      --accent: #4cc48e;
      --accent-hover: #63d09e;
      --accent-soft: rgb(76 196 142 / 13%);
      --accent-soft-2: rgb(76 196 142 / 22%);
      --on-accent: #05231a;
      --ring: rgb(76 196 142 / 45%);
      --warn: #e0b168;
      --warn-soft: rgb(224 177 104 / 13%);
      --danger: #e08b85;
      --danger-soft: rgb(224 139 133 / 13%);
      --c-emerald: #4cc48e;  --c-emerald-soft: rgb(76 196 142 / 14%);
      --c-indigo: #96a4ea;   --c-indigo-soft: rgb(150 164 234 / 14%);
      --c-amber: #e0b168;    --c-amber-soft: rgb(224 177 104 / 14%);
      --c-violet: #b79fe8;   --c-violet-soft: rgb(183 159 232 / 14%);
      --c-rose: #e59aa4;     --c-rose-soft: rgb(229 154 164 / 14%);
      --c-teal: #63c2c6;     --c-teal-soft: rgb(99 194 198 / 14%);
      --c-slate: #a6b1bd;    --c-slate-soft: rgb(166 177 189 / 14%);
      --shadow-s: 0 1px 2px rgb(0 0 0 / 40%);
      --shadow-m: 0 2px 10px -2px rgb(0 0 0 / 50%);
      --shadow-l: 0 16px 40px -16px rgb(0 0 0 / 70%);
    }
  }

  /* …затем явный выбор пользователя, который побеждает в обе стороны. */
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #0b0d0c;
    --surface: #151917;
    --surface-2: #1c211e;
    --surface-3: #262c29;
    --inset: #101413;
    --line: rgb(255 255 255 / 8%);
    --line-strong: rgb(255 255 255 / 15%);
    --ink: #eceeec;
    --muted: #a0aaa5;
    --subtle: #7c8681;
    --accent: #4cc48e;
    --accent-hover: #63d09e;
    --accent-soft: rgb(76 196 142 / 13%);
    --accent-soft-2: rgb(76 196 142 / 22%);
    --on-accent: #05231a;
    --ring: rgb(76 196 142 / 45%);
    --warn: #e0b168;
    --warn-soft: rgb(224 177 104 / 13%);
    --danger: #e08b85;
    --danger-soft: rgb(224 139 133 / 13%);
    --c-emerald: #4cc48e;  --c-emerald-soft: rgb(76 196 142 / 14%);
    --c-indigo: #96a4ea;   --c-indigo-soft: rgb(150 164 234 / 14%);
    --c-amber: #e0b168;    --c-amber-soft: rgb(224 177 104 / 14%);
    --c-violet: #b79fe8;   --c-violet-soft: rgb(183 159 232 / 14%);
    --c-rose: #e59aa4;     --c-rose-soft: rgb(229 154 164 / 14%);
    --c-teal: #63c2c6;     --c-teal-soft: rgb(99 194 198 / 14%);
    --c-slate: #a6b1bd;    --c-slate-soft: rgb(166 177 189 / 14%);
    --shadow-s: 0 1px 2px rgb(0 0 0 / 40%);
    --shadow-m: 0 2px 10px -2px rgb(0 0 0 / 50%);
    --shadow-l: 0 16px 40px -16px rgb(0 0 0 / 70%);
  }

  /* ============ БАЗА ============ */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 1.5rem);
  }

  h1, h2, h3 {
    font-family: Manrope, Inter, ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-wrap: balance;
    margin: 0;
  }

  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }

  button {
    font: inherit;
    color: inherit;
    border: none;
    background: none;
    cursor: pointer;
  }

  a { color: inherit; text-decoration: none; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 8px;
  }

  .wrap {
    width: 100%;
    max-width: 44rem;
    margin-inline: auto;
    padding-inline: 1rem;
  }

  .skip {
    position: absolute;
    left: 0.5rem;
    top: 0.5rem;
    z-index: 60;
    padding: 0.5rem 1rem;
    border-radius: 0.75rem;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
  }
  .skip:not(:focus) {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ============ ВЕРХНЯЯ ПАНЕЛЬ ============ */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    height: 3.5rem;
  }
  .brand {
    font-family: Manrope, sans-serif;
    font-weight: 800;
    font-size: 1.375rem;
    letter-spacing: 0.14em;
  }
  .iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    flex: none;
    border-radius: 999px;
    color: var(--muted);
    transition: background-color .15s, color .15s, transform .15s;
  }
  .iconbtn:hover { background: var(--surface-2); color: var(--ink); }
  .iconbtn:active { transform: scale(.92); }
  .spacer { margin-inline-start: auto; }

  /* ============ ГЛАВНАЯ ============ */
  .hello-ar {
    font-family: 'Noto Naskh Arabic', serif;
    direction: rtl;
    text-align: right;
    color: var(--subtle);
    font-size: 0.9375rem;
    font-weight: 600;
  }
  .hello-ru { font-size: 2rem; line-height: 1.15; margin-top: 0.25rem; }
  .hello-sub { margin-top: 0.5rem; color: var(--muted); font-weight: 600; min-height: 1.5rem; }

  .searchlink {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    min-height: 3rem;
    margin-top: 1rem;
    padding-inline: 1rem;
    border: 1px solid var(--line);
    border-radius: 1rem;
    background: var(--surface-2);
    color: var(--subtle);
    font-weight: 600;
    font-size: 0.9375rem;
  }

  .today {
    margin-top: 1rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-s);
  }
  .today-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .eyebrow {
    font-size: 0.6875rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--subtle);
  }
  .streak {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.75rem;
    font-weight: 800;
  }
  .today-list { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; margin-top: 0.75rem; }
  .today-item { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.9375rem; }
  .today-item .num { color: var(--subtle); font-variant-numeric: tabular-nums; }

  .heroes { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
  @media (min-width: 40rem) { .heroes { flex-direction: row; } .hero { flex: 1; } }

  .hero {
    display: block;
    padding: 1.25rem;
    border: 1px solid var(--line);
    border-radius: 1.75rem;
    background: var(--surface);
    box-shadow: var(--shadow-m);
    transition: box-shadow .2s, transform .2s;
  }
  .hero:hover { box-shadow: var(--shadow-l); }
  .hero:active { transform: scale(.99); }
  .hero-top { display: flex; align-items: flex-start; gap: 1rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    border-radius: 1rem;
    color: var(--chip-fg, var(--accent));
    background: var(--chip-bg, var(--accent-soft));
  }
  .chip.lg { width: 3.5rem; height: 3.5rem; font-size: 1.75rem; }
  .chip.sm { width: 2.5rem; height: 2.5rem; font-size: 1.25rem; border-radius: 0.75rem; }
  .chip.xs { width: 1.25rem; height: 1.25rem; font-size: 0.6875rem; border-radius: 0.375rem; }
  .hero h3 { font-size: 1.25rem; line-height: 1.2; }
  .hero .count { margin-top: 0.25rem; color: var(--muted); font-weight: 600; font-size: 0.875rem; }
  .hero .go {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    margin-top: 1rem;
    color: var(--accent);
    font-weight: 800;
    font-size: 0.9375rem;
  }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
  @media (min-width: 40rem) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .tile {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 6.5rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-s);
    transition: box-shadow .2s, transform .2s;
  }
  .tile:hover { box-shadow: var(--shadow-m); }
  .tile:active { transform: scale(.98); }
  .tile.dashed { border-style: dashed; border-color: var(--line-strong); background: transparent; box-shadow: none; }
  .tile h3 { font-size: 0.9375rem; line-height: 1.2; }
  .tile .count { margin-top: 0.125rem; color: var(--subtle); font-weight: 600; font-size: 0.75rem; }

  .done-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem; height: 1.5rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ============ ЗАГОЛОВОК РАЗДЕЛА ============ */
  .prog {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 3.5rem);
    z-index: 25;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .prog-in { padding-block: 0.75rem; }
  .prog-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
  .prog-title { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9375rem; font-weight: 800; min-width: 0; }
  .prog-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prog-num { flex: none; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.9375rem; }
  .prog-num i { font-style: normal; color: var(--subtle); }
  .bar { height: 0.375rem; margin-top: 0.5rem; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s ease-out; }

  /* ============ СЕГМЕНТЫ ============ */
  .seg {
    display: flex;
    gap: 0.25rem;
    padding: 0.25rem;
    border-radius: 1rem;
    background: var(--surface-2);
  }
  .seg button {
    flex: 1;
    height: 2.5rem;
    border-radius: 0.75rem;
    font-weight: 700;
    font-size: 0.9375rem;
    color: var(--muted);
    transition: background-color .2s, color .2s, box-shadow .2s;
  }
  .seg button[aria-checked='true'] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-s); }
  .seg.sm button { height: 2.25rem; font-size: 0.875rem; }

  /* ============ КАРТОЧКА АЗКАРА ============ */
  .cards { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }

  .card {
    padding: 1.25rem;
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-s);
    transition: border-color .3s, background-color .3s;
  }
  .card.done { border-color: var(--accent-soft-2); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
  .card-meta {
    font-size: 0.8125rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--subtle);
  }
  .card-meta .dot { opacity: .4; margin-inline: 0.375rem; }
  .card-meta .reps { text-transform: none; }
  .card h3 { margin-top: 0.25rem; font-size: 1.0625rem; line-height: 1.3; font-weight: 700; font-family: Inter, sans-serif; letter-spacing: -0.01em; }
  .card-actions { display: flex; flex: none; margin-inline-end: -0.5rem; }

  .arabic {
    margin-top: 1.25rem;
    font-family: 'Noto Naskh Arabic', 'Traditional Arabic', serif;
    font-size: var(--ar-size);
    line-height: var(--ar-lh);
    font-weight: 500;
    direction: rtl;
    text-align: right;
    unicode-bidi: isolate;
    word-spacing: 0.06em;
    overflow-wrap: break-word;
  }

  .translation { margin-top: 1.25rem; font-size: var(--tr-size); line-height: 1.65; font-weight: 600; }

  .translit-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    min-height: 2.75rem;
    margin-top: 0.75rem;
    margin-inline-start: -0.5rem;
    padding-inline: 0.5rem;
    border-radius: 0.75rem;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--muted);
  }
  .translit-toggle:hover { color: var(--ink); }
  .translit-toggle .caret { transition: transform .2s; }
  .translit-toggle[aria-expanded='true'] .caret { transform: rotate(180deg); }
  .translit {
    margin-top: 0.25rem;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    background: var(--inset);
    color: var(--muted);
    font-weight: 500;
    line-height: 1.6;
  }

  .source { margin-top: 1rem; padding: 0.875rem 1rem; border-radius: 1rem; background: var(--inset); }
  .source-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .source-name { margin-top: 0.5rem; font-size: 0.9375rem; font-weight: 600; line-height: 1.35; }
  .source-name i { font-style: normal; color: var(--muted); }
  .source-note { margin-top: 0.375rem; font-size: 0.8125rem; font-weight: 500; line-height: 1.4; color: var(--subtle); }
  .source-warn { margin-top: 0.5rem; font-size: 0.8125rem; font-weight: 500; line-height: 1.4; color: var(--warn); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    margin-inline-start: auto;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .badge.ok { background: var(--accent-soft); color: var(--accent); }
  .badge.review { background: var(--warn-soft); color: var(--warn); }

  .counter-row { display: flex; align-items: stretch; gap: 0.5rem; margin-top: 1rem; }
  .counter {
    position: relative;
    flex: 1;
    min-height: 4rem;
    padding-inline: 1.25rem;
    border-radius: 1rem;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 800;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    box-shadow: var(--shadow-s);
    transition: transform .15s, background-color .15s;
  }
  .counter:hover { background: var(--accent-hover); }
  .counter:active { transform: scale(.985); }
  .counter[disabled] { background: var(--accent-soft); color: var(--accent); cursor: default; transform: none; box-shadow: none; }
  .counter .fill {
    position: absolute;
    inset-block: 0;
    inset-inline-start: 0;
    background: rgb(0 0 0 / 10%);
    transition: width .3s ease-out;
  }
  :root[data-theme='dark'] .counter .fill { background: rgb(255 255 255 / 10%); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) .counter .fill { background: rgb(255 255 255 / 10%); }
  }
  .counter .lbl { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.625rem; }
  .counter .pop { display: inline-block; animation: pop .28s cubic-bezier(.34,1.4,.64,1); }

  .counter-reset {
    flex: none;
    width: 3.5rem;
    min-height: 4rem;
    border: 1px solid var(--line);
    border-radius: 1rem;
    background: var(--surface-2);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color .15s, color .15s, transform .15s;
  }
  .counter-reset:hover { background: var(--surface-3); color: var(--ink); }
  .counter-reset:active { transform: scale(.95); }

  .audio-note {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    background: var(--inset);
    color: var(--subtle);
    font-size: 0.8125rem;
    font-weight: 600;
  }

  /* ============ БАННЕРЫ ============ */
  .banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
    padding: 0.875rem 1rem;
    border: 1px solid var(--accent-soft-2);
    border-radius: 1.5rem;
    background: var(--accent-soft);
  }
  .banner p { flex: 1; min-width: 10rem; font-weight: 700; font-size: 0.9375rem; line-height: 1.3; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 2.75rem;
    padding-inline: 1rem;
    border-radius: 0.875rem;
    font-weight: 700;
    font-size: 0.9375rem;
    transition: background-color .15s, transform .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .btn.secondary:hover { background: var(--surface-3); }
  .btn.ghost { color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.full { width: 100%; }

  /* ============ РЕЖИМ «ПО ОДНОМУ» ============ */
  .pager {
    position: sticky;
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + 0.5rem);
    z-index: 20;
    display: flex;

      '" aria-label="' + esc(label) + '"><i style="width:' + pct + '%"></i></div>';
  }

  function counterInner(azkar, state) {
    if (state.done) {
      return '<span class="lbl">' + I.check(24) + '<span>' + azkar.repetitions + ' / ' + azkar.repetitions + '</span></span>';
    }
    var fill = azkar.repetitions > 1
      ? '<span class="fill" style="width:' + (state.count / azkar.repetitions) * 100 + '%"></span>'
      : '';
    return fill + '<span class="lbl"><span class="pop">' + state.count + ' / ' + azkar.repetitions + '</span></span>';
  }

  function cardHtml(azkar, number, total, categorySlug, opts) {
    var state = counterFor(azkar.category, azkar.id);
    var open = view.openTranslit[azkar.id];
    var parts = [];

    parts.push('<article class="card' + (state.done ? ' done' : '') + '" id="a-' + esc(azkar.id) + '" data-card="' + esc(azkar.id) + '" aria-label="Азкар ' + number + ' из ' + total + ': ' + esc(azkar.title) + '">');

    parts.push('<div class="card-head"><div style="min-width:0;flex:1">');
    parts.push('<p class="card-meta">№ ' + number + '<span class="dot">·</span><span class="reps">' + azkar.repetitions + ' ' + plural(azkar.repetitions, ['раз', 'раза', 'раз']) + '</span></p>');
    parts.push('<h3>' + esc(azkar.title) + '</h3></div>');
    parts.push('<div class="card-actions">');
    parts.push('<button class="iconbtn" data-act="share" data-id="' + esc(azkar.id) + '" aria-label="Поделиться: ' + esc(azkar.title) + '">' + I.share(20) + '</button>');
    parts.push('<button class="iconbtn' + (isFav(azkar.id) ? ' fav-on' : '') + '" data-act="fav" data-id="' + esc(azkar.id) + '" aria-pressed="' + isFav(azkar.id) + '" aria-label="' + (isFav(azkar.id) ? 'Убрать из избранного' : 'Добавить в избранное') + '">' + I.heart(21, isFav(azkar.id)) + '</button>');
    parts.push('</div></div>');

    parts.push('<p class="arabic" dir="rtl" lang="ar">' + esc(azkar.arabic) + '</p>');

    if (settings.showTranslation) parts.push('<p class="translation">' + esc(azkar.translation) + '</p>');

    if (settings.showTranslit) {
      parts.push('<button class="translit-toggle" data-act="translit" data-id="' + esc(azkar.id) + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        (open ? 'Скрыть транскрипцию' : 'Показать транскрипцию') + '<span class="caret">' + I.down(16) + '</span></button>');
      if (open) parts.push('<p class="translit">' + esc(azkar.transliteration) + '</p>');
    }

    parts.push('<div class="source"><div class="source-head"><span class="eyebrow" style="display:inline-flex;align-items:center;gap:.375rem">' + I.book(16) + 'Источник</span>' + badge(azkar.verified) + '</div>');
    parts.push('<p class="source-name">' + esc(azkar.source.collection) + (azkar.source.reference ? '<i>, ' + esc(azkar.source.reference) + '</i>' : '') + '</p>');
    if (azkar.sourceDetails) parts.push('<p class="source-note">' + esc(azkar.sourceDetails) + '</p>');
    if (!azkar.verified) parts.push('<p class="source-warn">Текст приведён, но точная ссылка ещё не выверена редактором. Не полагайтесь на неё как на подтверждённую.</p>');
    parts.push('</div>');

    if (opts && opts.single) {
      parts.push('<p class="audio-note">' + I.speaker(16) + 'Аудио для этой записи пока не добавлено</p>');
    }

    parts.push('<div class="counter-row">');
    parts.push('<button class="counter" data-act="count" data-id="' + esc(azkar.id) + '" data-pos="' + (number - 1) + '"' + (state.done ? ' disabled' : '') + ' aria-label="Счётчик повторов: ' + esc(azkar.title) + '">' + counterInner(azkar, state) + '</button>');
    if (state.count > 0) {
      parts.push('<button class="counter-reset" data-act="uncount" data-id="' + esc(azkar.id) + '" aria-label="Сбросить счётчик этого азкара">' + I.refresh(20) + '</button>');
    }
    parts.push('</div>');
    parts.push('<span class="sr" role="status" aria-live="polite">Выполнено ' + state.count + ' из ' + azkar.repetitions + '</span>');
    parts.push('</article>');
    return parts.join('');
  }

  var SUGGESTIONS = ['защита', 'тревога', 'прощение', 'сон', 'дорога', 'дети', 'болезнь', 'коран'];
  var searchQuery = '';

  function normalize(value) {
    return String(value).toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
  }

  var INDEX = ALL.map(function (a) {
    var cat = CAT_BY_ID[a.category];
    return {
      azkar: a,
      fields: [
        { text: normalize(a.title), w: 12 },
        { text: normalize(a.tags.join(' ')), w: 9 },
        { text: normalize(cat.title + ' ' + cat.shortTitle), w: 7 },
        { text: normalize(a.translation), w: 5 },
        { text: normalize(a.source.collection + ' ' + (a.source.reference || '') + ' ' + (a.sourceDetails || '')), w: 4 },
        { text: normalize(a.transliteration), w: 3 }
      ]
    };
  });

  function runSearch(raw) {
    var q = normalize(raw);
    if (q.length < 2) return [];
    var words = q.split(' ').filter(Boolean);
    var out = [];
    INDEX.forEach(function (entry) {
      var score = 0;
      var matched = 0;
      words.forEach(function (word) {
        var hit = false;
        entry.fields.forEach(function (field) {
          var at = field.text.indexOf(word);
          if (at < 0) return;
          hit = true;
          score += field.w * (at === 0 || field.text[at - 1] === ' ' ? 1.5 : 1);
        });
        if (hit) matched += 1;
      });
      if (matched !== words.length) return;
      if (entry.azkar.verified) score += 1;
      out.push({ azkar: entry.azkar, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score || a.azkar.id.localeCompare(b.azkar.id); });
    return out;
  }

  function renderSearch() {
    var html = '<div class="wrap" style="padding-block:.5rem 1.5rem"><h1 style="font-size:1.75rem;line-height:1.2">Поиск</h1>';
    html += '<div class="search-field"><span class="lead" style="position:absolute;top:50%;inset-inline-start:1rem;transform:translateY(-50%);color:var(--subtle);pointer-events:none">' + I.search(20) + '</span>' +
      '<input id="q" type="search" autocomplete="off" enterkeyhint="search" aria-label="Поиск по азкарам" placeholder="Например: защита, тревога, Муслим" value="' + esc(searchQuery) + '"></div>';

    if (normalize(searchQuery).length < 2) {
      html += '<p class="eyebrow" style="display:block;margin-top:1.5rem">Попробуйте</p><div class="chips">';
      SUGGESTIONS.forEach(function (s) { html += '<button data-act="suggest" data-q="' + esc(s) + '">' + esc(s) + '</button>'; });
      html += '</div>';
    } else {
      var results = runSearch(searchQuery);
      html += '<p aria-live="polite" style="margin-top:1rem;color:var(--muted);font-weight:600;font-size:.875rem">' +
        (results.length ? results.length + ' ' + plural(results.length, ['результат', 'результата', 'результатов']) : 'Ничего не найдено') + '</p>';
      if (!results.length) {
        html += '<p style="margin-top:.5rem;color:var(--subtle);font-weight:500;line-height:1.6">Попробуйте другое слово — например, «защита», «прощение» или название сборника.</p>';
      } else {
        html += '<div class="cards">' + results.map(function (r) { return miniHtml(r.azkar); }).join('') + '</div>';
      }
    }
    return html + '</div>';
  }

  /* ================= НАСТРОЙКИ ================= */
  function toggleRow(key, label, note, disabled) {
    return '<button class="row" role="switch" aria-checked="' + settings[key] + '" data-act="toggle" data-key="' + key + '"' + (disabled ? ' disabled' : '') + '>' +
      '<span class="lbl"><b>' + esc(label) + '</b>' + (note ? '<small>' + esc(note) + '</small>' : '') + '</span>' +
      '<span class="switch" aria-hidden="true"><i></i></span></button>';
  }

  function stepperRow(key, label, preview, previewStyle) {
    var value = settings[key];
    return '<div class="row" style="display:block"><div style="display:flex;align-items:center;justify-content:space-between;gap:1rem">' +
      '<span style="font-size:.9375rem;font-weight:600">' + esc(label) + '</span>' +
      '<span class="stepper"><button data-act="step" data-key="' + key + '" data-delta="-1"' + (value <= -2 ? ' disabled' : '') + ' aria-label="Уменьшить: ' + esc(label) + '">A−</button>' +
      '<span class="val" aria-live="polite">' + (value > 0 ? '+' + value : value) + '</span>' +
      '<button data-act="step" data-key="' + key + '" data-delta="1"' + (value >= 3 ? ' disabled' : '') + ' aria-label="Увеличить: ' + esc(label) + '" style="font-size:1.125rem">A+</button></span>' +
      '</div><p class="preview" style="' + previewStyle + '">' + preview + '</p></div>';
  }

  var confirmReset = false;

  function sheetHtml() {
    var html = '<div class="sheet-root" data-act="sheet-bg-wrap"><div class="sheet-bg" data-act="close-sheet"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-head"><div style="flex:1;min-width:0"><div class="sheet-grab" aria-hidden="true"></div>' +
      '<h2 id="sheet-title">Настройки</h2><p>Сохраняются в этом браузере</p></div>' +
      '<button class="iconbtn" data-act="close-sheet" aria-label="Закрыть" style="background:var(--surface-2);margin-top:.75rem">' + I.close(20) + '</button></div>' +
      '<div class="sheet-body">';

    html += '<span class="eyebrow">Оформление</span>';
    html += '<div class="row" style="display:block"><p style="font-size:.9375rem;font-weight:600;margin-bottom:.5rem">Тема оформления</p>' +
      '<div class="seg" role="radiogroup" aria-label="Тема оформления">' +
      ['auto', 'light', 'dark'].map(function (t, i) {
        var names = ['Авто', 'Светлая', 'Тёмная'];
        return '<button role="radio" aria-checked="' + (settings.theme === t) + '" data-act="theme" data-theme="' + t + '">' + names[i] + '</button>';
      }).join('') + '</div></div>';

    html += '<span class="eyebrow">Размер текста</span>';
    html += stepperRow('ar', 'Арабский текст', 'بِسْمِ اللَّهِ',
      "font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;line-height:1.9;font-size:" + AR_SIZE[settings.ar]);
    html += stepperRow('tr', 'Русский перевод', 'Хвала Аллаху, Господу миров.',
      'font-weight:600;line-height:1.6;font-size:' + TR_SIZE[settings.tr]);

    html += '<span class="eyebrow">Что показывать</span>';
    html += toggleRow('showTranslation', 'Перевод', 'Русский текст под арабским', false);
    html += toggleRow('showTranslit', 'Транскрипция', 'Кириллическое чтение арабского текста', false);

    html += '<span class="eyebrow">Чтение</span>';
    html += toggleRow('vibration', 'Вибрация', 'Короткий отклик при нажатии счётчика', false);
    html += toggleRow('autoAdvance', 'Автопереход', 'Переходить к следующему азкару после последнего повтора', false);

    html += '<span class="eyebrow">Данные</span><div style="display:flex;flex-direction:column;gap:.5rem;padding:.25rem 1rem 1rem">';
    html += '<button class="btn secondary full" data-act="clear-fav">Очистить избранное</button>';
    if (confirmReset) {
      html += '<div style="padding:.75rem;border:1px solid var(--line);border-radius:1rem;background:var(--inset)">' +
        '<p style="font-size:.875rem;font-weight:600;line-height:1.4;margin-bottom:.625rem">Сбросить весь прогресс и серию дней? Это действие нельзя отменить.</p>' +
        '<div style="display:flex;gap:.5rem"><button class="btn secondary full" data-act="reset-no">Отмена</button>' +
        '<button class="btn danger full" data-act="reset-yes">Сбросить</button></div></div>';
    } else {
      html += '<button class="btn secondary full" data-act="reset-ask">Сбросить весь прогресс</button>';
    }
    html += '<button class="btn ghost full" data-act="reset-settings">Вернуть настройки по умолчанию</button>';
    html += '</div>';

    html += '</div></div></div>';
    return html;
  }

  var sheetOpen = false;
  var lastFocused = null;

  function renderSheet() {
    var host = document.getElementById('sheet-host');
    host.innerHTML = sheetOpen ? sheetHtml() : '';
    if (sheetOpen) {
      var first = host.querySelector('button');
      if (first) first.focus();
    }
    renderChrome();
  }

  function openSheet() {
    lastFocused = document.activeElement;
    sheetOpen = true;
    confirmReset = false;
    document.body.style.overflow = 'hidden';
    renderSheet();
  }

  function closeSheet() {
    sheetOpen = false;
    document.body.style.overflow = '';
    renderSheet();
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  /* ================= КАРКАС ================= */
  function renderChrome() {
    var top = document.getElementById('topbar');
    top.innerHTML = route.name === 'home'
      ? '<a class="brand" href="#/">AZKAR</a>' +
        '<span class="spacer"></span>' +
        '<a class="iconbtn" href="#/search" aria-label="Поиск по азкарам">' + I.search(20) + '</a>' +
        '<button class="iconbtn" data-act="open-sheet" aria-haspopup="dialog" aria-expanded="' + sheetOpen + '" aria-label="Настройки">' + I.gear(20) + '</button>'
      : '<button class="iconbtn" data-act="back" aria-label="Назад" style="margin-inline-start:-.5rem">' + I.back(20) + '</button>' +
        '<span class="spacer"></span>' +
        '<a class="iconbtn" href="#/search" aria-label="Поиск по азкарам">' + I.search(20) + '</a>' +
        '<button class="iconbtn" data-act="open-sheet" aria-haspopup="dialog" aria-expanded="' + sheetOpen + '" aria-label="Настройки">' + I.gear(20) + '</button>';

    var nav = document.getElementById('bottomnav');
    var items = [
      { href: '#/', label: 'Главная', icon: I.home(22), on: route.name === 'home' },
      { href: '#/search', label: 'Азкары', icon: I.beads(22), on: route.name === 'category' || route.name === 'search' },
      { href: '#/favorites', label: 'Избранное', icon: null, on: route.name === 'favorites' }
    ];
    nav.innerHTML = items.map(function (it) {
      var icon = it.icon || I.heart(22, it.on);
      return '<li><a href="' + it.href + '"' + (it.on ? ' aria-current="page"' : '') + '>' + icon + it.label + '</a></li>';
    }).join('') +
      '<li><button data-act="open-sheet" class="' + (sheetOpen ? 'active' : '') + '" aria-haspopup="dialog" aria-expanded="' + sheetOpen + '">' + I.gear(22) + 'Настройки</button></li>';
  }

  function render(keepScroll) {
    var y = window.scrollY;
    var host = document.getElementById('view');
    if (route.name === 'home') host.innerHTML = renderHome();
    else if (route.name === 'category') host.innerHTML = renderCategory(route.slug);
    else if (route.name === 'favorites') host.innerHTML = renderFavorites();
    else if (route.name === 'search') host.innerHTML = renderSearch();
    else if (route.name === 'about') host.innerHTML = renderAbout();
    else host.innerHTML = renderNotFound();
    renderChrome();
    if (keepScroll) window.scrollTo(0, y);
  }

  function onRouteChange() {
    var next = parseHash();
    var changedCategory = next.name !== route.name || next.slug !== route.slug;
    route = next;
    if (changedCategory) {
      view = { index: 0, resumeDismissed: false, openTranslit: {} };
      searchQuery = '';
    }
    render(false);
    window.scrollTo(0, 0);
    if (route.name === 'search') {
      var input = document.getElementById('q');
      if (input) input.focus();
    }
  }

  /* ================= СЧЁТЧИК ================= */
  var COOLDOWN = 220;
  var lastTap = 0;

  function refreshProgressHeader() {
    if (route.name !== 'category') return;
    var s = summary(CAT_BY_SLUG[route.slug].id);
    var num = document.getElementById('prog-num');
    var bar = document.getElementById('prog-bar');
    if (num) num.innerHTML = s.completed + ' <i>из</i> ' + s.total;
    if (bar) bar.innerHTML = progressBar(s.ratio, 'Прогресс раздела');
  }

  function handleCount(id, position) {
    var now = Date.now();
    // Защита от случайного двойного тапа: слишком быстрый повтор игнорируется.
    if (now - lastTap < COOLDOWN) return;
    lastTap = now;

    var azkar = BY_ID[id];
    var target = Math.max(1, azkar.repetitions);
    var state;

    writeProgress(azkar.category, function (next) {
      var current = next.counters[id] || { count: 0, done: false };
      var count = Math.min(current.count + 1, target);
      state = { count: count, done: count >= target };
      next.counters[id] = state;
      next.last = id;
    });

    if (state.done) {
      var list = DATA.azkar[azkar.category] || [];
      var p = catProgress(azkar.category);
      var all = list.every(function (a) { return p.counters[a.id] && p.counters[a.id].done; });
      if (all) recordCompletion(azkar.category);
      vibrate([18, 40, 24]);
    } else {
      vibrate(12);
    }

    // Точечное обновление вместо полной перерисовки — иначе теряется позиция скролла.
    var card = document.querySelector('[data-card="' + id + '"]');
    if (card) {
      var button = card.querySelector('[data-act="count"]');
      button.innerHTML = counterInner(azkar, state);
      if (state.done) {
        button.setAttribute('disabled', '');
        card.classList.add('done');
      }
      var row = card.querySelector('.counter-row');
      if (state.count > 0 && !row.querySelector('[data-act="uncount"]')) {
        var reset = document.createElement('button');
        reset.className = 'counter-reset';
        reset.setAttribute('data-act', 'uncount');
        reset.setAttribute('data-id', id);
        reset.setAttribute('aria-label', 'Сбросить счётчик этого азкара');
        reset.innerHTML = I.refresh(20);
        row.appendChild(reset);
      }
      var live = card.querySelector('[role="status"]');
      if (live) live.textContent = 'Выполнено ' + state.count + ' из ' + target;
    }

    refreshProgressHeader();

    if (state.done && settings.autoAdvance) {
      var list2 = DATA.azkar[azkar.category] || [];
      if (position + 1 < list2.length) {
        setTimeout(function () {
          if (settings.mode === 'single') {
            view.index = position + 1;
            render(false);
            window.scrollTo(0, 0);
          } else {
            var nextCard = document.querySelector('[data-card="' + list2[position + 1].id + '"]');
            if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 480);
      } else if (settings.mode === 'list') {
        render(true);
      }
    } else if (state.done) {
      render(true);
    }
  }

  /* ================= СОБЫТИЯ ================= */
  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'count') { handleCount(el.getAttribute('data-id'), Number(el.getAttribute('data-pos'))); return; }

    if (act === 'uncount') {
      var uid = el.getAttribute('data-id');
      writeProgress(BY_ID[uid].category, function (next) { next.counters[uid] = { count: 0, done: false }; });
      render(true);
      return;
    }

    if (act === 'fav') {
      toggleFav(el.getAttribute('data-id'));
      vibrate(12);
      render(true);
      return;
    }

    if (act === 'translit') {
      var tid = el.getAttribute('data-id');
      view.openTranslit[tid] = !view.openTranslit[tid];
      render(true);
      return;
    }

    if (act === 'share') {
      var a = BY_ID[el.getAttribute('data-id')];
      var text = a.title + '\n\n' + a.translation + '\n\nИсточник: ' + a.source.collection +
        (a.source.reference ? ', ' + a.source.reference : '') + (a.verified ? '' : '\n(запись требует проверки источника)');
      if (navigator.share) {
        navigator.share({ title: a.title + ' — AZKAR', text: text }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () { toast('Текст скопирован'); }, function () { toast('Не удалось скопировать'); });
      } else {
        toast('Копирование недоступно');
      }
      return;
    }

    if (act === 'mode') { setSetting('mode', el.getAttribute('data-mode')); render(false); window.scrollTo(0, 0); return; }
    if (act === 'resume') { view.resumeDismissed = true; view.index = Number(el.getAttribute('data-index')); render(false); return; }
    if (act === 'resume-no') { view.resumeDismissed = true; render(true); return; }
    if (act === 'reset-cat') {
      var cid = CAT_BY_SLUG[route.slug].id;
      delete progress[cid];
      save(KEY.p, progress);
      view.index = 0;
      view.resumeDismissed = true;
      render(false);
      window.scrollTo(0, 0);
      return;
    }
    if (act === 'prev') { view.index = Math.max(0, view.index - 1); render(false); window.scrollTo(0, 0); return; }
    if (act === 'next') {
      var total = (DATA.azkar[CAT_BY_SLUG[route.slug].id] || []).length;
      view.index = Math.min(total - 1, view.index + 1);
      render(false);
      window.scrollTo(0, 0);
      return;
    }

    if (act === 'suggest') { searchQuery = el.getAttribute('data-q'); render(false); return; }
    // window.history, а не наша переменная history с историей дней.
    if (act === 'back') { if (window.history.length > 1) window.history.back(); else go('#/'); return; }

    if (act === 'open-sheet') { openSheet(); return; }
    if (act === 'close-sheet') { closeSheet(); return; }
    if (act === 'theme') { setSetting('theme', el.getAttribute('data-theme')); renderSheet(); render(true); return; }
    if (act === 'toggle') { var k = el.getAttribute('data-key'); setSetting(k, !settings[k]); renderSheet(); render(true); return; }
    if (act === 'step') {
      var sk = el.getAttribute('data-key');
      var delta = Number(el.getAttribute('data-delta'));
      setSetting(sk, Math.max(-2, Math.min(3, settings[sk] + delta)));
      renderSheet();
      render(true);
      return;
    }
    if (act === 'clear-fav') { favorites = []; save(KEY.f, favorites); toast('Избранное очищено'); render(true); return; }
    if (act === 'reset-ask') { confirmReset = true; renderSheet(); return; }
    if (act === 'reset-no') { confirmReset = false; renderSheet(); return; }
    if (act === 'reset-yes') {
      progress = {}; history = [];
      save(KEY.p, progress); save(KEY.h, history);
      confirmReset = false;
      renderSheet();
      render(true);
      toast('Прогресс сброшен');
      return;
    }
    if (act === 'reset-settings') {
      settings = Object.assign({}, DEFAULTS);
      save(KEY.s, settings);
      applySettings();
      renderSheet();
      render(true);
      return;
    }
  });

  document.addEventListener('input', function (event) {
    if (event.target && event.target.id === 'q') {
      searchQuery = event.target.value;
      var at = event.target.selectionStart;
      render(true);
      var again = document.getElementById('q');
      if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch (e) {} }
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && sheetOpen) { event.preventDefault(); closeSheet(); return; }
    if (event.key !== 'Tab' || !sheetOpen) return;
    // Ловушка фокуса: из открытой шторки нельзя уйти табом на страницу под ней.
    var focusable = document.querySelectorAll('.sheet button:not([disabled]), .sheet a[href], .sheet input');
    if (!focusable.length) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });

  window.addEventListener('hashchange', onRouteChange);

  /* ================= СТАРТ ================= */
  applySettings();
  route = parseHash();
  render(false);
})();
</script>
