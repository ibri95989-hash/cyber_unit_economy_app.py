<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Mont';src:url('Montserrat.ttf') format('truetype');font-weight:100 900;font-display:block}
@font-face{font-family:'Inter';src:url('Inter.ttf') format('truetype');font-weight:100 900;font-display:block}
@font-face{font-family:'Mono';src:url('JetBrainsMono.ttf') format('truetype');font-weight:100 800;font-display:block}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block;width:1080px;height:1920px}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="words.js"></script>
<script src="reel.js"></script>
<script>
window.__ready=false;
(async()=>{ await document.fonts.load('900 100px Mont'); await document.fonts.load('700 100px Mont');
  await document.fonts.load('500 100px Inter'); await document.fonts.load('800 100px Inter');
  await document.fonts.load('700 100px Mono'); await document.fonts.ready; window.__ready=true; })();
</script></body></html>
