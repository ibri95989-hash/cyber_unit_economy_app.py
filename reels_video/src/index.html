<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Mont';src:url('Montserrat.ttf') format('truetype');font-weight:100 900;font-display:block}
@font-face{font-family:'Inter';src:url('Inter.ttf') format('truetype');font-weight:100 900;font-display:block}
@font-face{font-family:'Mono';src:url('JetBrainsMono.ttf') format('truetype');font-weight:100 800;font-display:block}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block;width:1080px;height:1920px}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="plan.js"></script>
<script src="reel.js"></script>
<script>
window.__ready=false; window.__fontError=null;
(async()=>{
  const need=[['900 100px Mont','Mont'],['700 100px Mont','Mont'],
              ['500 100px Inter','Inter'],['800 100px Inter','Inter'],
              ['700 100px Mono','Mono']];
  // Битый шрифт заставляет document.fonts.load() ждать вечно — ограничиваем время.
  const guard=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r('timeout'),ms))]);
  try{
    for(const [spec] of need) await guard(document.fonts.load(spec), 8000);
    await guard(document.fonts.ready, 8000);
  }catch(e){}
  const missing=[...new Set(need.filter(([spec])=>!document.fonts.check(spec)).map(x=>x[1]))];
  if(missing.length) window.__fontError='шрифты не загрузились: '+missing.join(', ');
  window.__ready=true;
})();
</script></body></html>
