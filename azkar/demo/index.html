страхом перед Тобой. Нет убежища и спасения от Тебя, кроме как у Тебя. Я уверовал в Твоё Писание, которое Ты ниспослал, и в Твоего пророка, которого Ты отправил.","transliteration":"Аллахумма, аслямту нафси илейк, ва фаввадту амри илейк, ва ваджжахту ваджхи илейк, ва альджа'ту захри илейк, рагбатан ва рахбатан илейк. Ля мальджа'а ва ля манджа минка илля илейк. Аманту би-китабика-ллязи анзальт, ва би-набиййика-ллязи арсальт.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"sourceDetails":"Пророк ﷺ велел произносить это последними словами перед сном.","tags":["сон","упование","вера"],"verified":false},{"id":"sleep-04-ayat-al-kursi","category":"sleep","order":4,"title":"Аят аль-Курси","arabic":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","translation":"Аллах — нет божества, кроме Него, Живого, Вечносущего. Не овладевают Им ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто заступится перед Ним без Его дозволения? Он знает их прошлое и их будущее, а они постигают из Его знания лишь то, что Он пожелает. Престол Его объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.","transliteration":"Аллаху ля иляха илля Хуа-ль-Хаййу-ль-Каййум. Ля та'хузуху синатун ва ля наум. Ляху ма фи-с-самавати ва ма фи-ль-ард. Ман заллязи яшфа'у 'индаху илля би-изних. Я'ляму ма байна айдихим ва ма хальфахум, ва ля юхитуна би-шайин мин 'ильмихи илля бима ша'а. Васи'а курсиййуху-с-самавати ва-ль-ард, ва ля я'удуху хифзухума, ва Хуа-ль-'Алиййу-ль-'Азым.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:255"},"sourceDetails":"Сура «аль-Бакара», аят 255.","tags":["сон","защита","коран"],"verified":true},{"id":"sleep-05-al-ikhlas","category":"sleep","order":5,"title":"Сура «аль-Ихляс»","arabic":"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","translation":"Скажи: «Он — Аллах, Единый. Аллах Самодостаточный. Он не родил и не был рождён, и нет никого, равного Ему».","transliteration":"Куль Хуа-Ллаху Ахад. Аллаху-с-Самад. Лям ялид ва лям юляд. Ва лям якуль-ляху куфуван ахад.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"112:1–4"},"sourceDetails":"Сура «аль-Ихляс» полностью.","tags":["сон","защита","коран"],"verified":true},{"id":"sleep-06-al-falaq","category":"sleep","order":6,"title":"Сура «аль-Фаляк»","arabic":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","translation":"Скажи: «Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла дующих на узлы и от зла завистника, когда он завидует».","transliteration":"Куль а'узу би-Рабби-ль-фаляк. Мин шарри ма халяк. Ва мин шарри гасикын иза вакаб. Ва мин шарри-н-наффасати фи-ль-'укад. Ва мин шарри хасидин иза хасад.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"113:1–5"},"sourceDetails":"Сура «аль-Фаляк» полностью.","tags":["сон","защита","коран"],"verified":true},{"id":"sleep-07-an-nas","category":"sleep","order":7,"title":"Сура «ан-Нас»","arabic":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ","translation":"Скажи: «Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла наущающего, отступающего при поминании Аллаха, который наущает в груди людей, — из джиннов и людей».","transliteration":"Куль а'узу би-Рабби-н-нас. Малики-н-нас. Иляхи-н-нас. Мин шарри-ль-васваси-ль-ханнас. Аллязи ювасвису фи судури-н-нас. Мина-ль-джиннати ва-н-нас.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"114:1–6"},"sourceDetails":"Сура «ан-Нас» полностью.","tags":["сон","защита","коран"],"verified":true},{"id":"sleep-08-baqarah-last-two","category":"sleep","order":8,"title":"Последние два аята суры «аль-Бакара»","arabic":"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","translation":"Уверовал Посланник в то, что ниспослано ему от Господа его, и уверовали верующие. Все они уверовали в Аллаха, Его ангелов, Его Писания и Его посланников: «Мы не различаем между Его посланниками». И сказали они: «Мы услышали и повинуемся. Прощения Твоего просим, Господь наш, и к Тебе возвращение». Аллах не возлагает на душу ничего сверх её возможностей: ей достанется то, что она приобрела, и против неё будет то, что она совершила. Господь наш, не взыщи с нас, если мы забыли или ошиблись. Господь наш, не возлагай на нас бремя, которое Ты возложил на наших предшественников. Господь наш, не возлагай на нас того, что нам не под силу. Избавь нас, прости нам и помилуй нас. Ты — наш Покровитель, помоги же нам против неверующих.","transliteration":"Амана-р-расулю бима унзиля иляйхи мин Раббихи ва-ль-му'минун. Куллюн амана би-Лляхи ва маляикатихи ва кутубихи ва русулих. Ля нуфаррику байна ахадин мин русулих. Ва калю: сами'на ва ата'на, гуфранака Раббана ва илейка-ль-масыр. Ля юкаллифу-Ллаху нафсан илля вус'аха. Ляха ма касабат ва 'алейха ма-ктасабат. Раббана ля туахизна ин насина ау ахта'на. Раббана ва ля тахмиль 'алейна исран кама хамальтаху 'аля-ллязина мин каблина. Раббана ва ля тухаммильна ма ля таката ляна бих. Ва'фу 'анна ва-гфир ляна ва-рхамна. Анта Мауляна фа-нсурна 'аля-ль-кауми-ль-кяфирин.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:285–286"},"sourceDetails":"Сура «аль-Бакара», аяты 285–286.","tags":["сон","защита","коран"],"verified":true},{"id":"sleep-09-tasbih","category":"sleep","order":9,"title":"Пречист Аллах","arabic":"سُبْحَانَ اللَّهِ","translation":"Пречист Аллах.","transliteration":"Субхана-Ллах.","repetitions":33,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"sourceDetails":"Из хадиса о наставлении Фатиме, да будет доволен ею Аллах: 33 + 33 + 34 перед сном.","tags":["сон","тасбих"],"verified":false},{"id":"sleep-10-tahmid","category":"sleep","order":10,"title":"Хвала Аллаху","arabic":"الْحَمْدُ لِلَّهِ","translation":"Хвала Аллаху.","transliteration":"Аль-хамду ли-Лляh.","repetitions":33,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["сон","хвала"],"verified":false},{"id":"sleep-11-takbir","category":"sleep","order":11,"title":"Аллах велик","arabic":"اللَّهُ أَكْبَرُ","translation":"Аллах велик.","transliteration":"Аллаху акбар.","repetitions":34,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["сон","такбир"],"verified":false},{"id":"sleep-12-qini-adhabaka","category":"sleep","order":12,"title":"Защити меня от Твоего наказания","arabic":"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ","translation":"О Аллах, защити меня от Твоего наказания в День, когда Ты воскресишь Своих рабов.","transliteration":"Аллахумма, кыни 'азабака йаума таб'асу 'ибадак.","repetitions":3,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у ат-Тирмизи.","tags":["сон","защита","судный день"],"verified":false}],"waking":[{"id":"waking-01-alhamdulillah-ahyana","category":"waking","order":1,"title":"Хвала Аллаху, Который оживил нас","arabic":"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ","translation":"Хвала Аллаху, Который оживил нас после того, как умертвил, и к Нему воскрешение.","transliteration":"Аль-хамду ли-Лляхи-ллязи ахйана ба'да ма аматана ва илейхи-н-нушур.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари"},"tags":["пробуждение","хвала"],"verified":false},{"id":"waking-02-radda-alayya-ruhi","category":"waking","order":2,"title":"Хвала Аллаху, вернувшему мне душу","arabic":"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لِي بِذِكْرِهِ","translation":"Хвала Аллаху, Который даровал здоровье моему телу, вернул мне душу и позволил мне поминать Его.","transliteration":"Аль-хамду ли-Лляхи-ллязи 'афани фи джасади, ва радда 'аляййа рухи, ва азина ли би-зикрих.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"tags":["пробуждение","благодарность","здоровье"],"verified":false},{"id":"waking-03-tahlil-pri-probuzhdenii","category":"waking","order":3,"title":"Поминание при пробуждении ночью","arabic":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. الْحَمْدُ لِلَّهِ، وَسُبْحَانَ اللَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ. رَبِّ اغْفِرْ لِي","translation":"Нет божества, кроме одного лишь Аллаха, у Которого нет сотоварища. Ему принадлежит власть, Ему хвала, и Он всё может. Хвала Аллаху, пречист Аллах, нет божества, кроме Аллаха, Аллах велик, и нет силы и мощи ни у кого, кроме Аллаха, Возвышенного, Великого. Господь мой, прости меня.","transliteration":"Ля иляха илля-Ллаху вахдаху ля шарика лях, ляху-ль-мульку ва ляху-ль-хамд, ва Хуа 'аля кулли шайин кадир. Аль-хамду ли-Лляh, ва субхана-Ллаh, ва ля иляха илля-Ллаh, ва-Ллаху акбар, ва ля хауля ва ля куввата илля би-Лляхи-ль-'Алиййи-ль-'Азым. Рабби-гфир ли.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари"},"sourceDetails":"Передаётся о том, кто проснулся ночью.","tags":["пробуждение","ночь","единобожие"],"verified":false},{"id":"waking-04-al-imran-190","category":"waking","order":4,"title":"Аяты из суры «Али Имран»","arabic":"إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِّأُولِي الْأَلْبَابِ ۝ الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ","translation":"Воистину, в сотворении небес и земли и в смене ночи и дня — знамения для обладающих разумом, которые поминают Аллаха стоя, сидя и на боку и размышляют о сотворении небес и земли: «Господь наш! Ты сотворил это не напрасно. Пречист Ты! Защити же нас от мучений в Огне».","transliteration":"Инна фи хальки-с-самавати ва-ль-арди ва-хтиляфи-л-лейли ва-н-нахари ля-аятин ли-ули-ль-альбаб. Аллязина йазкуруна-Ллаха кыяман ва ку'удан ва 'аля джунубихим ва ятафаккаруна фи хальки-с-самавати ва-ль-ард: Раббана, ма халякта хаза батыля, субханака, факына 'азаба-н-нар.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"3:190–191"},"sourceDetails":"Сура «Али Имран», аяты 190–191. Текст сверен по Корану; отдельно уточните предание о чтении при пробуждении.","tags":["пробуждение","коран","размышление"],"verified":false}],"protection":[{"id":"protection-01-kalimat-at-tammat","category":"protection","order":1,"title":"Прибегаю к совершенным словам Аллаха","arabic":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","translation":"Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил.","transliteration":"А'узу би-калимати-Лляхи-т-таммати мин шарри ма халяк.","repetitions":3,"source":{"kind":"hadith","collection":"Сахих Муслим"},"sourceDetails":"Читается вечером, а также при остановке в незнакомом месте.","tags":["защита","от вреда","путешествие"],"verified":false},{"id":"protection-02-la-yadurru","category":"protection","order":2,"title":"С именем Аллаха, с именем Которого ничто не навредит","arabic":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ","translation":"С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небе, и Он — Слышащий, Знающий.","transliteration":"Бисми-Лляхи-ллязи ля ядурру ма'а-смихи шайун фи-ль-арди ва ля фи-с-сама, ва Хуа-с-Сами'у-ль-'Алим.","repetitions":3,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"tags":["защита","от вреда","утро","вечер"],"verified":false},{"id":"protection-03-hasbunallah","category":"protection","order":3,"title":"Достаточно нам Аллаха","arabic":"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","translation":"Достаточно нам Аллаха, и как прекрасен этот Попечитель!","transliteration":"Хасбуна-Ллаху ва ни'ма-ль-вакиль.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"3:173"},"sourceDetails":"Часть аята 173 суры «Али Имран».","tags":["защита","упование","страх","коран"],"verified":true},{"id":"protection-04-najaluka-fi-nuhurihim","category":"protection","order":4,"title":"Мольба против вражды","arabic":"اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِمْ، وَنَعُوذُ بِكَ مِنْ شُرُورِهِمْ","translation":"О Аллах, мы делаем Тебя защитой от них и прибегаем к Тебе от их зла.","transliteration":"Аллахумма, инна надж'алюка фи нухурихим, ва на'узу бика мин шурурихим.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Пророк ﷺ произносил это, опасаясь вреда от людей.","tags":["защита","враги","страх"],"verified":false},{"id":"protection-05-hamazat-ash-shayatin","category":"protection","order":5,"title":"От наущений шайтанов","arabic":"رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ۝ وَأَعُوذُ بِكَ رَبِّ أَن يَحْضُرُونِ","translation":"Господь мой, прибегаю к Тебе от наущений дьяволов, и прибегаю к Тебе, Господь мой, от того, чтобы они приближались ко мне.","transliteration":"Рабби, а'узу бика мин хамазати-ш-шаятын. Ва а'узу бика, Рабби, ан яхдурун.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"23:97–98"},"sourceDetails":"Сура «аль-Муминун», аяты 97–98.","tags":["защита","шайтан","наущения","коран"],"verified":true},{"id":"protection-06-uidhukuma","category":"protection","order":6,"title":"Защита для детей","arabic":"أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ","translation":"Отдаю вас под защиту совершенных слов Аллаха от всякого шайтана, от всякого ядовитого существа и от всякого дурного глаза.","transliteration":"У'изукума би-калимати-Лляхи-т-тамма, мин кулли шайтанин ва хамма, ва мин кулли 'айнин лямма.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари"},"sourceDetails":"Пророк ﷺ читал это для аль-Хасана и аль-Хусейна. Для одного ребёнка окончания слов меняются — уточните форму у знающего человека.","tags":["защита","дети","сглаз"],"verified":false},{"id":"protection-07-ayat-al-kursi","category":"protection","order":7,"title":"Аят аль-Курси","arabic":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","translation":"Аллах — нет божества, кроме Него, Живого, Вечносущего. Не овладевают Им ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто заступится перед Ним без Его дозволения? Он знает их прошлое и их будущее, а они постигают из Его знания лишь то, что Он пожелает. Престол Его объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.","transliteration":"Аллаху ля иляха илля Хуа-ль-Хаййу-ль-Каййум. Ля та'хузуху синатун ва ля наум. Ляху ма фи-с-самавати ва ма фи-ль-ард. Ман заллязи яшфа'у 'индаху илля би-изних. Я'ляму ма байна айдихим ва ма хальфахум, ва ля юхитуна би-шайин мин 'ильмихи илля бима ша'а. Васи'а курсиййуху-с-самавати ва-ль-ард, ва ля я'удуху хифзухума, ва Хуа-ль-'Алиййу-ль-'Азым.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:255"},"sourceDetails":"Сура «аль-Бакара», аят 255.","tags":["защита","коран","дом"],"verified":true},{"id":"protection-08-al-falaq","category":"protection","order":8,"title":"Сура «аль-Фаляк»","arabic":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","translation":"Скажи: «Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла дующих на узлы и от зла завистника, когда он завидует».","transliteration":"Куль а'узу би-Рабби-ль-фаляк. Мин шарри ма халяк. Ва мин шарри гасикын иза вакаб. Ва мин шарри-н-наффасати фи-ль-'укад. Ва мин шарри хасидин иза хасад.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"113:1–5"},"sourceDetails":"Сура «аль-Фаляк» полностью.","tags":["защита","коран","сглаз","зависть"],"verified":true},{"id":"protection-09-an-nas","category":"protection","order":9,"title":"Сура «ан-Нас»","arabic":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ","translation":"Скажи: «Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла наущающего, отступающего при поминании Аллаха, который наущает в груди людей, — из джиннов и людей».","transliteration":"Куль а'узу би-Рабби-н-нас. Малики-н-нас. Иляхи-н-нас. Мин шарри-ль-васваси-ль-ханнас. Аллязи ювасвису фи судури-н-нас. Мина-ль-джиннати ва-н-нас.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"114:1–6"},"sourceDetails":"Сура «ан-Нас» полностью.","tags":["защита","коран","наущения"],"verified":true}],"quran-duas":[{"id":"quran-duas-01-hasanatan-fid-dunya","category":"quran-duas","order":1,"title":"Господь наш, даруй нам благо в обоих мирах","arabic":"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","translation":"Господь наш! Даруй нам благо в этом мире и благо в мире вечном и защити нас от мучений в Огне.","transliteration":"Раббана, атина фи-д-дунья хасанатан ва фи-ль-ахырати хасанатан ва кына 'азаба-н-нар.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:201"},"sourceDetails":"Сура «аль-Бакара», аят 201.","tags":["коран","благо","универсальная дуа"],"verified":true},{"id":"quran-duas-02-la-tuakhidhna","category":"quran-duas","order":2,"title":"Не взыщи с нас, если мы забыли","arabic":"رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","translation":"Господь наш! Не взыщи с нас, если мы забыли или ошиблись. Господь наш! Не возлагай на нас бремя, которое Ты возложил на наших предшественников. Господь наш! Не возлагай на нас того, что нам не под силу. Избавь нас, прости нам и помилуй нас. Ты — наш Покровитель, помоги же нам против неверующих.","transliteration":"Раббана, ля туахизна ин насина ау ахта'на. Раббана, ва ля тахмиль 'алейна исран кама хамальтаху 'аля-ллязина мин каблина. Раббана, ва ля тухаммильна ма ля таката ляна бих. Ва'фу 'анна ва-гфир ляна ва-рхамна. Анта Мауляна фа-нсурна 'аля-ль-кауми-ль-кяфирин.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:286"},"sourceDetails":"Сура «аль-Бакара», аят 286.","tags":["коран","прощение","трудности"],"verified":true},{"id":"quran-duas-03-la-tuzigh-qulubana","category":"quran-duas","order":3,"title":"Не отклоняй наши сердца","arabic":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ","translation":"Господь наш! Не отклоняй наши сердца после того, как Ты наставил нас на прямой путь, и даруй нам от Себя милость. Воистину, Ты — Дарующий.","transliteration":"Раббана, ля тузиг кулюбана ба'да из хадайтана, ва хаб ляна мин лядунка рахма. Иннака Анта-ль-Ваххаб.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"3:8"},"sourceDetails":"Сура «Али Имран», аят 8.","tags":["коран","стойкость","вера","сердце"],"verified":true},{"id":"quran-duas-04-ighfir-lana-dhunubana","category":"quran-duas","order":4,"title":"Прости нам наши грехи","arabic":"رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","translation":"Господь наш! Прости нам наши грехи и излишества, которые мы допустили в нашем деле, утверди наши стопы и помоги нам против неверующих.","transliteration":"Раббана-гфир ляна зунубана ва исрафана фи амрина, ва саббит акдамана, ва-нсурна 'аля-ль-кауми-ль-кяфирин.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"3:147"},"sourceDetails":"Сура «Али Имран», аят 147.","tags":["коран","прощение","стойкость"],"verified":true},{"id":"quran-duas-05-zalamna-anfusana","category":"quran-duas","order":5,"title":"Мы поступили несправедливо с собой","arabic":"رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","translation":"Господь наш! Мы поступили несправедливо с собой, и если Ты не простишь нас и не помилуешь, то мы непременно окажемся в числе потерпевших урон.","transliteration":"Раббана, залямна анфусана, ва ин лям тагфир ляна ва тархамна ля-накунанна мина-ль-хасирин.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"7:23"},"sourceDetails":"Сура «аль-Араф», аят 23 — мольба Адама, мир ему.","tags":["коран","покаяние","прощение"],"verified":true},{"id":"quran-duas-06-ishrah-li-sadri","category":"quran-duas","order":6,"title":"Раскрой мою грудь","arabic":"رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ۝ يَفْقَهُوا قَوْلِي","translation":"Господь мой! Раскрой для меня мою грудь, облегчи мою задачу, развяжи узел на моём языке, чтобы они могли понять мою речь.","transliteration":"Рабби-шрах ли садри, ва яссир ли амри, ва-хлюль укдатан мин лисани, яфкаху каули.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"20:25–28"},"sourceDetails":"Сура «Та Ха», аяты 25–28 — мольба Мусы, мир ему.","tags":["коран","трудности","речь","работа","экзамен"],"verified":true},{"id":"quran-duas-07-dua-yunus","category":"quran-duas","order":7,"title":"Мольба Юнуса, мир ему","arabic":"لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ","translation":"Нет божества, кроме Тебя! Пречист Ты! Воистину, я был одним из беззаконников.","transliteration":"Ля иляха илля Анта, субханака, инни кунту мина-з-залимин.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"21:87"},"sourceDetails":"Сура «аль-Анбия», аят 87.","tags":["коран","беда","покаяние","трудности"],"verified":true},{"id":"quran-duas-08-awzini-an-ashkura","category":"quran-duas","order":8,"title":"Внуши мне благодарность","arabic":"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ","translation":"Господь мой! Внуши мне благодарность за милость, которой Ты облагодетельствовал меня и моих родителей, и побуди меня совершать праведные дела, которыми Ты доволен. Введи меня по Твоей милости в число Твоих праведных рабов.","transliteration":"Рабби, аузи'ни ан ашкура ни'матака-ллети ан'амта 'аляййа ва 'аля валидаййа, ва ан а'маля салихан тардах, ва адхыльни би-рахматика фи 'ибадика-с-салихин.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"27:19"},"sourceDetails":"Сура «ан-Намль», аят 19 — мольба Сулеймана, мир ему.","tags":["коран","благодарность","родители"],"verified":true},{"id":"quran-duas-09-qurrata-ayun","category":"quran-duas","order":9,"title":"Отрада для наших глаз","arabic":"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا","translation":"Господь наш! Даруй нам в наших жёнах и потомках отраду глаз и сделай нас образцом для богобоязненных.","transliteration":"Раббана, хаб ляна мин азваджина ва зурриййатина куррата а'юн, ва-дж'альна ли-ль-муттакына имама.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"25:74"},"sourceDetails":"Сура «аль-Фуркан», аят 74.","tags":["коран","семья","дети","брак"],"verified":true},{"id":"quran-duas-10-hab-li-mina-s-salihin","category":"quran-duas","order":10,"title":"Даруй мне праведного потомка","arabic":"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ","translation":"Господь мой! Даруй мне потомка из числа праведников.","transliteration":"Рабби, хаб ли мина-с-салихин.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"37:100"},"sourceDetails":"Сура «ас-Саффат», аят 100 — мольба Ибрахима, мир ему.","tags":["коран","дети","потомство"],"verified":true},{"id":"quran-duas-11-zidni-ilman","category":"quran-duas","order":11,"title":"Господь мой, прибавь мне знания","arabic":"رَّبِّ زِدْنِي عِلْمًا","translation":"Господь мой! Прибавь мне знания.","transliteration":"Рабби, зидни 'ильма.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"20:114"},"sourceDetails":"Часть аята 114 суры «Та Ха».","tags":["коран","знание","учёба","экзамен"],"verified":true},{"id":"quran-duas-12-afrigh-alayna-sabran","category":"quran-duas","order":12,"title":"Пролей на нас терпение","arabic":"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","translation":"Господь наш! Пролей на нас терпение, утверди наши стопы и помоги нам против неверующих.","transliteration":"Раббана, африг 'алейна сабран, ва саббит акдамана, ва-нсурна 'аля-ль-кауми-ль-кяфирин.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:250"},"sourceDetails":"Сура «аль-Бакара», аят 250.","tags":["коран","терпение","стойкость","трудности"],"verified":true},{"id":"quran-duas-13-muqima-s-salah","category":"quran-duas","order":13,"title":"Сделай меня совершающим намаз","arabic":"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ","translation":"Господь мой! Сделай меня и часть моего потомства совершающими намаз. Господь наш! Прими мою мольбу.","transliteration":"Рабби-дж'альни мукыма-с-саляти ва мин зурриййати. Раббана, ва такаббаль ду'а.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"14:40"},"sourceDetails":"Сура «Ибрахим», аят 40.","tags":["коран","намаз","дети","потомство"],"verified":true},{"id":"quran-duas-14-rabbana-taqabbal-minna","category":"quran-duas","order":14,"title":"Господь наш, прими от нас","arabic":"رَبَّنَا تَقَبَّلْ مِنَّا ۖ إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ","translation":"Господь наш! Прими от нас. Воистину, Ты — Слышащий, Знающий.","transliteration":"Раббана, такаббаль минна. Иннака Анта-с-Сами'у-ль-'Алим.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:127"},"sourceDetails":"Часть аята 127 суры «аль-Бакара».","tags":["коран","принятие дел","поклонение"],"verified":true}],"prophet-duas":[{"id":"prophet-duas-01-al-huda-wat-tuqa","category":"prophet-duas","order":1,"title":"Прошу у Тебя прямого пути и богобоязненности","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى، وَالتُّقَى، وَالْعَفَافَ، وَالْغِنَى","translation":"О Аллах, прошу у Тебя прямого пути, богобоязненности, целомудрия и независимости от людей.","transliteration":"Аллахумма, инни ас'алюка-ль-худа, ва-т-тука, ва-ль-'афафа, ва-ль-гына.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"tags":["прямой путь","богобоязненность","удел"],"verified":false},{"id":"prophet-duas-02-aslih-li-dini","category":"prophet-duas","order":2,"title":"Приведи в порядок мою религию","arabic":"اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ","translation":"О Аллах, приведи в порядок мою религию, которая есть защита моего дела; приведи в порядок мою земную жизнь, в которой моё существование; приведи в порядок мою вечную жизнь, к которой я вернусь. Сделай жизнь для меня умножением всякого блага, а смерть — покоем от всякого зла.","transliteration":"Аллахумма, аслих ли дини-ллязи хува 'исмату амри, ва аслих ли дуньяйа-ллети фиха ма'аши, ва аслих ли ахырати-ллети фиха ма'ади, ва-дж'али-ль-хаята зиядатан ли фи кулли хайр, ва-дж'али-ль-маута рахатан ли мин кулли шарр.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"tags":["религия","жизнь","смерть","универсальная дуа"],"verified":false},{"id":"prophet-duas-03-al-hammi-wal-hazan","category":"prophet-duas","order":3,"title":"От тревоги и печали","arabic":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","translation":"О Аллах, прибегаю к Тебе от тревоги и печали, от бессилия и лени, от скупости и трусости, от бремени долга и притеснения людей.","transliteration":"Аллахумма, инни а'узу бика мина-ль-хамми ва-ль-хазан, ва-ль-'аджзи ва-ль-кясаль, ва-ль-бухли ва-ль-джубн, ва дала'и-д-дайни ва галябати-р-риджаль.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари"},"tags":["тревога","печаль","долг","депрессия"],"verified":false},{"id":"prophet-duas-04-ya-muqallibal-qulub","category":"prophet-duas","order":4,"title":"О Обращающий сердца","arabic":"يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ","translation":"О Обращающий сердца, утверди моё сердце в Твоей религии.","transliteration":"Йа Мукаллиба-ль-кулюб, саббит кальби аля диник.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"tags":["сердце","стойкость","вера"],"verified":false},{"id":"prophet-duas-05-zawali-nimatik","category":"prophet-duas","order":5,"title":"От исчезновения Твоей милости","arabic":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ، وَتَحَوُّلِ عَافِيَتِكَ، وَفُجَاءَةِ نِقْمَتِكَ، وَجَمِيعِ سَخَطِكَ","translation":"О Аллах, прибегаю к Тебе от исчезновения Твоей милости, от перемены дарованного Тобой благополучия, от внезапности Твоего наказания и от всего, что вызывает Твой гнев.","transliteration":"Аллахумма, инни а'узу бика мин заваали ни'матик, ва тахаввули 'афиятик, ва фуджа'ати никматик, ва джами'и сахатык.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"tags":["милость","благополучие","защита"],"verified":false},{"id":"prophet-duas-06-rabbighfir-li-wa-tub-alayya","category":"prophet-duas","order":6,"title":"Прости меня и прими моё покаяние","arabic":"رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ","translation":"Господь мой, прости меня и прими моё покаяние. Воистину, Ты — Принимающий покаяние, Милосердный.","transliteration":"Рабби-гфир ли ва туб 'аляййа, иннака Анта-т-Таввабу-р-Рахим.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у ат-Тирмизи и Ибн Маджи.","tags":["прощение","покаяние","истигфар"],"verified":false},{"id":"prophet-duas-07-hubbaka-wa-hubba-man-yuhibbuk","category":"prophet-duas","order":7,"title":"Прошу у Тебя любви к Тебе","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَالْعَمَلَ الَّذِي يُبَلِّغُنِي حُبَّكَ","translation":"О Аллах, прошу у Тебя любви к Тебе, любви к тем, кто любит Тебя, и дела, которое приблизит меня к Твоей любви.","transliteration":"Аллахумма, инни ас'алюка хуббак, ва хубба ман юхиббук, ва-ль-'амаля-ллязи юбаллигуни хуббак.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"tags":["любовь","дела","сердце"],"verified":false},{"id":"prophet-duas-08-ilmin-la-yanfa","category":"prophet-duas","order":8,"title":"От бесполезного знания","arabic":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا","translation":"О Аллах, прибегаю к Тебе от знания, которое не приносит пользы, от сердца, которое не смиряется, от души, которая не насыщается, и от мольбы, на которую нет ответа.","transliteration":"Аллахумма, инни а'узу бика мин 'ильмин ля янфа', ва мин кальбин ля яхша', ва мин нафсин ля ташба', ва мин да'ватин ля юстаджабу ляха.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"tags":["знание","сердце","искренность"],"verified":false},{"id":"prophet-duas-09-ighfir-li-dhanbi-kullah","category":"prophet-duas","order":9,"title":"Прости мне все мои грехи","arabic":"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ","translation":"О Аллах, прости мне все мои грехи — малые и большие, первые и последние, явные и тайные.","transliteration":"Аллахумма-гфир ли занби куллях, диккаху ва джиллях, ва аввалаху ва ахырах, ва алянийятаху ва сиррах.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"tags":["прощение","грехи","покаяние"],"verified":false},{"id":"prophet-duas-10-al-jannah-wan-nar","category":"prophet-duas","order":10,"title":"Прошу у Тебя Рая и защиты от Огня","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ، وَأَعُوذُ بِكَ مِنَ النَّارِ","translation":"О Аллах, прошу у Тебя Рая и прибегаю к Тебе от Огня.","transliteration":"Аллахумма, инни ас'алюка-ль-джанна, ва а'узу бика мина-н-нар.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Пророк ﷺ учил произносить это после ташаххуда в намазе.","tags":["рай","огонь","намаз"],"verified":false}],"situations":[{"id":"situations-01-pered-edoy","category":"situations","order":1,"title":"Перед едой","arabic":"بِسْمِ اللَّهِ","translation":"С именем Аллаха. (Если забыли в начале, говорят: «С именем Аллаха в начале и в конце».)","transliteration":"Бисми-Лляh.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Полная форма при забывчивости: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ — «Бисми-Лляхи аввеляху ва ахырах».","tags":["еда","дом","быт"],"verified":false},{"id":"situations-02-posle-edy","category":"situations","order":2,"title":"После еды","arabic":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","translation":"Хвала Аллаху, Который накормил меня этим и наделил меня этим без всякой силы и мощи с моей стороны.","transliteration":"Аль-хамду ли-Лляхи-ллязи ат'амани хаза ва разаканихи мин гайри хаулин минни ва ля кувва.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у ат-Тирмизи и Ибн Маджи.","tags":["еда","благодарность","быт"],"verified":false},{"id":"situations-03-vyhod-iz-doma","category":"situations","order":3,"title":"При выходе из дома","arabic":"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","translation":"С именем Аллаха. Я уповаю на Аллаха, и нет силы и мощи ни у кого, кроме Аллаха.","transliteration":"Бисми-Лляh, таваккальту 'аля-Лляh, ва ля хауля ва ля куввата илля би-Лляh.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у ат-Тирмизи.","tags":["дом","дорога","защита","быт"],"verified":false},{"id":"situations-04-vhod-v-dom","category":"situations","order":4,"title":"При входе в дом","arabic":"بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا","translation":"С именем Аллаха мы вошли, с именем Аллаха мы вышли и на Аллаха, Господа нашего, мы положились.","transliteration":"Бисми-Лляхи валяджна, ва бисми-Лляхи хараджна, ва 'аля-Лляхи Раббина таваккальна.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"tags":["дом","быт","защита"],"verified":false},{"id":"situations-05-vhod-v-tualet","category":"situations","order":5,"title":"При входе в уборную","arabic":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ","translation":"О Аллах, прибегаю к Тебе от нечистых мужского и женского рода.","transliteration":"Аллахумма, инни а'узу бика мина-ль-хубуси ва-ль-хабаис.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["быт","защита"],"verified":false},{"id":"situations-06-vyhod-iz-tualeta","category":"situations","order":6,"title":"При выходе из уборной","arabic":"غُفْرَانَكَ","translation":"Прошу Твоего прощения.","transliteration":"Гуфранак.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у ат-Тирмизи и Ибн Маджи.","tags":["быт","прощение"],"verified":false},{"id":"situations-07-nadevanie-odezhdy","category":"situations","order":7,"title":"При надевании одежды","arabic":"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا الثَّوْبَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","translation":"Хвала Аллаху, Который одел меня в эту одежду и наделил меня ею без всякой силы и мощи с моей стороны.","transliteration":"Аль-хамду ли-Лляхи-ллязи касани хаза-с-сауба ва разаканихи мин гайри хаулин минни ва ля кувва.","repetiti     check: function (s) { return '<svg viewBox="0 0 24 24" width="' + (s || 16) + '" height="' + (s || 16) + '" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>'; },
    right: function (s) { return svg('<path d="M4 12h15"/><path d="m13 6 6 6-6 6"/>', s); },
    left: function (s) { return svg('<path d="M20 12H5"/><path d="m11 6-6 6 6 6"/>', s); },
    down: function (s) { return svg('<path d="m6 9 6 6 6-6"/>', s); },
    close: function (s) { return svg('<path d="M6 6 18 18"/><path d="M18 6 6 18"/>', s); },
    refresh: function (s) { return svg('<path d="M20 11a8 8 0 1 0-.9 4.6"/><path d="M20 5v6h-6"/>', s); },
    share: function (s) { return svg('<path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M6 12H5a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-1"/>', s); },
    book: function (s) { return svg('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5Z"/>', s); },
    speaker: function (s) { return svg('<path d="M11 5 6.5 8.7H3.5v6.6h3L11 19Z"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6"/>', s); },
    flame: function (s) { return svg('<path d="M12 3s5 4.2 5 8.6a5 5 0 0 1-10 0C7 9.4 9 7.6 9 7.6s.5 1.8 1.7 2.4C10.5 7.8 12 3 12 3Z"/>', s); },
    alert: function (s) { return svg('<path d="M12 4.5 2.8 20h18.4Z"/><path d="M12 10v4"/><path d="M12 17h.01"/>', s); },
    back: function (s) { return svg('<path d="M20 12H5"/><path d="m11 6-6 6 6 6"/>', s); }
  };

  function chipStyle(accent) {
    return 'style="--chip-fg:var(--c-' + accent + ');--chip-bg:var(--c-' + accent + '-soft)"';
  }

  /* ================= РОУТЕР ================= */
  var route = { name: 'home', slug: null };
  var view = { index: 0, resumeDismissed: false, openTranslit: {} };

  function parseHash() {
    var raw = (location.hash || '#/').replace(/^#/, '');
    var parts = raw.split('/').filter(Boolean);
    if (!parts.length) return { name: 'home', slug: null };
    if (parts[0] === 'c' && parts[1] && CAT_BY_SLUG[parts[1]]) return { name: 'category', slug: parts[1] };
    if (parts[0] === 'favorites' || parts[0] === 'search' || parts[0] === 'about') return { name: parts[0], slug: null };
    return { name: 'notfound', slug: null };
  }

  function go(hash) { location.hash = hash; }

  /* ================= ОБЩИЕ КУСКИ РАЗМЕТКИ ================= */
  function badge(verified) {
    return verified
      ? '<span class="badge ok">' + I.check(14) + 'Источник проверен</span>'
      : '<span class="badge review">' + I.alert(14) + 'Требует проверки</span>';
  }

  function progressBar(ratio, label) {
    var pct = Math.round(Math.max(0, Math.min(1, ratio)) * 100);
    return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct +
      '" aria-label="' + esc(label) + '"><i style="width:' + pct + '%"></i></div>';
  }

  function counterInner(azkar, state) {
    if (state.done) {
      return '<span class="lbl">' + I.check(24) + '<span>' + azkar.repetitions + ' / ' + azkar.repetitions + '</span></span>';
    }
    var fill = azkar.repetitions > 1
      ? '<span class="fill" style="width:' + (state.count / azkar.repetitions) * 100 + '%"></span>'
      : '';
    return fill + '<span class="lbl"><span class="pop">' + state.count + ' / ' + azkar.repetitions + '</span></span>';
  }

  function cardHtml(azkar, number, total, categorySlug, opts) {
    var state = counterFor(azkar.category, azkar.id);
    var open = view.openTranslit[azkar.id];
    var parts = [];

    parts.push('<article class="card' + (state.done ? ' done' : '') + '" id="a-' + esc(azkar.id) + '" data-card="' + esc(azkar.id) + '" aria-label="Азкар ' + number + ' из ' + total + ': ' + esc(azkar.title) + '">');

    parts.push('<div class="card-head"><div style="min-width:0;flex:1">');
    parts.push('<p class="card-meta">№ ' + number + '<span class="dot">·</span><span class="reps">' + azkar.repetitions + ' ' + plural(azkar.repetitions, ['раз', 'раза', 'раз']) + '</span></p>');
    parts.push('<h3>' + esc(azkar.title) + '</h3></div>');
    parts.push('<div class="card-actions">');
    parts.push('<button class="iconbtn" data-act="share" data-id="' + esc(azkar.id) + '" aria-label="Поделиться: ' + esc(azkar.title) + '">' + I.share(20) + '</button>');
    parts.push('<button class="iconbtn' + (isFav(azkar.id) ? ' fav-on' : '') + '" data-act="fav" data-id="' + esc(azkar.id) + '" aria-pressed="' + isFav(azkar.id) + '" aria-label="' + (isFav(azkar.id) ? 'Убрать из избранного' : 'Добавить в избранное') + '">' + I.heart(21, isFav(azkar.id)) + '</button>');
    parts.push('</div></div>');

    parts.push('<p class="arabic" dir="rtl" lang="ar">' + esc(azkar.arabic) + '</p>');

    if (settings.showTranslation) parts.push('<p class="translation">' + esc(azkar.translation) + '</p>');

    if (settings.showTranslit) {
      parts.push('<button class="translit-toggle" data-act="translit" data-id="' + esc(azkar.id) + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        (open ? 'Скрыть транскрипцию' : 'Показать транскрипцию') + '<span class="caret">' + I.down(16) + '</span></button>');
      if (open) parts.push('<p class="translit">' + esc(azkar.transliteration) + '</p>');
    }

    parts.push('<div class="source"><div class="source-head"><span class="eyebrow" style="display:inline-flex;align-items:center;gap:.375rem">' + I.book(16) + 'Источник</span>' + badge(azkar.verified) + '</div>');
    parts.push('<p class="source-name">' + esc(azkar.source.collection) + (azkar.source.reference ? '<i>, ' + esc(azkar.source.reference) + '</i>' : '') + '</p>');
    if (azkar.sourceDetails) parts.push('<p class="source-note">' + esc(azkar.sourceDetails) + '</p>');
    if (!azkar.verified) parts.push('<p class="source-warn">Текст приведён, но точная ссылка ещё не выверена редактором. Не полагайтесь на неё как на подтверждённую.</p>');
    parts.push('</div>');

    if (opts && opts.single) {
      parts.push('<p class="audio-note">' + I.speaker(16) + 'Аудио для этой записи пока не добавлено</p>');
    }

    parts.push('<div class="counter-row">');
    parts.push('<button class="counter" data-act="count" data-id="' + esc(azkar.id) + '" data-pos="' + (number - 1) + '"' + (state.done ? ' disabled' : '') + ' aria-label="Счётчик повторов: ' + esc(azkar.title) + '">' + counterInner(azkar, state) + '</button>');
    if (state.count > 0) {
      parts.push('<button class="counter-reset" data-act="uncount" data-id="' + esc(azkar.id) + '" aria-label="Сбросить счётчик этого азкара">' + I.refresh(20) + '</button>');
    }
    parts.push('</div>');
    parts.push('<span class="sr" role="status" aria-live="polite">Выполнено ' + state.count + ' из ' + azkar.repetitions + '</span>');
    parts.push('</article>');
    return parts.join('');
  }

  function miniHtml(azkar) {
    var cat = CAT_BY_ID[azkar.category];
    return '<article class="mini">' +
      '<div class="mini-head"><div style="min-width:0;flex:1">' +
      '<a class="mini-cat" href="#/c/' + cat.slug + '"><span class="chip xs" ' + chipStyle(cat.accent) + '>' + cat.emoji + '</span>' + esc(cat.shortTitle) + '</a>' +
      '<h3>' + esc(azkar.title) + '</h3></div>' +
      '<button class="iconbtn' + (isFav(azkar.id) ? ' fav-on' : '') + '" data-act="fav" data-id="' + esc(azkar.id) + '" aria-pressed="' + isFav(azkar.id) + '" aria-label="' + (isFav(azkar.id) ? 'Убрать из избранного' : 'Добавить в избранное') + '">' + I.heart(21, isFav(azkar.id)) + '</button>' +
      '</div>' +
      '<p class="arabic" dir="rtl" lang="ar">' + esc(azkar.arabic) + '</p>' +
      '<p class="excerpt">' + esc(azkar.translation) + '</p>' +
      '<div class="mini-foot"><span class="src">' + esc(azkar.source.collection) + (azkar.source.reference ? ', ' + esc(azkar.source.reference) : '') + '</span>' + badge(azkar.verified) + '</div>' +
      '<a class="go" href="#/c/' + cat.slug + '" style="display:inline-flex;align-items:center;gap:.375rem;margin-top:.75rem;color:var(--accent);font-weight:800;font-size:.9375rem;min-height:2.75rem">Открыть в разделе ' + I.right(16) + '</a>' +
      '</article>';
  }

  /* ================= ЭКРАНЫ ================= */
  function greeting() {
    var h = new Date().getHours();
    if (h >= 4 && h < 11) return 'Доброе утро';
    if (h >= 11 && h < 16) return 'Добрый день';
    if (h >= 16 && h < 22) return 'Добрый вечер';
    return 'Доброй ночи';
  }

  function suggestedFirst() {
    var h = new Date().getHours();
    return h >= 16 || h < 4 ? 'evening' : 'morning';
  }

  function heroHtml(cat) {
    var s = summary(cat.id);
    var started = s.completed > 0;
    var label = s.isComplete ? 'Прочитано' : started ? 'Продолжить' : 'Начать';
    var body = '<a class="hero" href="#/c/' + cat.slug + '">' +
      '<div class="hero-top"><span class="chip lg" ' + chipStyle(cat.accent) + ' aria-hidden="true">' + cat.emoji + '</span>' +
      '<div style="min-width:0;flex:1"><h3>' + esc(cat.title) + '</h3>' +
      '<p class="count">' + cat.count + ' ' + plural(cat.count, ['азкар', 'азкара', 'азкаров']) + '</p></div>' +
      (s.isComplete ? '<span class="done-mark" style="width:2rem;height:2rem" aria-hidden="true">' + I.check(16) + '</span>' : '') +
      '</div>';
    if (started) {
      body += '<div style="margin-top:1rem"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.375rem">' +
        '<span style="font-size:.8125rem;font-weight:700;color:var(--muted)">' + s.completed + ' из ' + s.total + '</span>' +
        '<span style="font-size:.8125rem;font-weight:700;color:var(--accent)">' + Math.round(s.ratio * 100) + '%</span></div>' +
        progressBar(s.ratio, 'Прогресс: ' + cat.title) + '</div>';
    }
    body += '<span class="go">' + label + I.right(16) + '</span></a>';
    return body;
  }

  function tileHtml(cat) {
    var s = summary(cat.id);
    return '<a class="tile" href="#/c/' + cat.slug + '">' +
      '<div style="display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start">' +
      '<span class="chip sm" ' + chipStyle(cat.accent) + ' aria-hidden="true">' + cat.emoji + '</span>' +
      (s.isComplete ? '<span class="done-mark" aria-hidden="true">' + I.check(14) + '</span>' : '') +
      '</div><div style="margin-top:.75rem"><h3>' + esc(cat.shortTitle) + '</h3>' +
      '<p class="count">' + (s.completed > 0 && !s.isComplete ? s.completed + ' из ' + s.total : cat.count + ' ' + plural(cat.count, ['азкар', 'азкара', 'азкаров'])) + '</p>' +
      '</div></a>';
  }

  function renderHome() {
    var firstId = suggestedFirst();
    var heroIds = firstId === 'evening' ? ['evening', 'morning'] : ['morning', 'evening'];
    var heroes = heroIds.map(function (id) { return CAT_BY_ID[id]; });
    var rest = CATS.filter(function (c) { return heroIds.indexOf(c.id) < 0; });
    var run = streak();

    var html = '<div class="wrap" style="padding-block:.25rem 1.5rem">';
    html += '<p class="hello-ar" dir="rtl" lang="ar">السلام عليكم</p>';
    html += '<h1 class="hello-ru">Ассаляму алейкум</h1>';
    html += '<p class="hello-sub">' + greeting() + '</p>';

    html += '<a class="searchlink" href="#/search">' + I.search(18) + 'Найти дуа — например, «защита»</a>';

    html += '<section class="today" aria-label="Сводка за сегодня"><div class="today-head"><h2 class="eyebrow">Сегодня</h2>';
    if (run > 0) html += '<span class="streak">' + I.flame(14) + run + ' ' + plural(run, ['день', 'дня', 'дней']) + ' подряд</span>';
    html += '</div><ul class="today-list">';
    heroes.forEach(function (c) {
      var s = summary(c.id);
      html += '<li class="today-item"><span aria-hidden="true">' + c.emoji + '</span><span>' + esc(c.shortTitle) + '</span>' +
        (s.isComplete ? '<span style="color:var(--accent)" aria-label="выполнено">✅</span>' : '<span class="num">' + s.completed + '/' + s.total + '</span>') + '</li>';
    });
    html += '</ul></section>';

    html += '<div class="heroes">' + heroes.map(heroHtml).join('') + '</div>';

    html += '<h2 class="eyebrow" style="display:block;margin-top:1.75rem">Остальные разделы</h2>';
    html += '<div class="grid">' + rest.map(tileHtml).join('');
    html += '<a class="tile dashed" href="#/favorites">' +
      '<span class="chip sm" style="--chip-fg:var(--danger);--chip-bg:var(--danger-soft)" aria-hidden="true">❤️</span>' +
      '<div style="margin-top:.75rem"><h3>Избранное</h3><p class="count">Ваши закладки</p></div></a>';
    html += '</div>';

    html += '<p style="margin-top:2rem;font-size:.8125rem;line-height:1.6;font-weight:500;color:var(--subtle)">' +
      'Прогресс сохраняется в этом браузере и обнуляется каждый день. ' +
      '<a href="#/about" style="color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px">О достоверности текстов</a></p>';

    html += '</div>';
    return html;
  }

  function renderCategory(slug) {
    var cat = CAT_BY_SLUG[slug];
    var list = DATA.azkar[cat.id] || [];
    var s = summary(cat.id);
    var single = settings.mode === 'single';
    if (view.index > list.length - 1) view.index = Math.max(0, list.length - 1);

    var html = '<div class="prog"><div class="wrap prog-in">' +
      '<div class="prog-row"><h2 class="prog-title"><span aria-hidden="true">' + cat.emoji + '</span><span>' + esc(cat.title) + '</span></h2>' +
      '<p class="prog-num" id="prog-num">' + s.completed + ' <i>из</i> ' + s.total + '</p></div>' +
      '<div id="prog-bar">' + progressBar(s.ratio, 'Прогресс раздела «' + cat.title + '»') + '</div>' +
      '</div></div>';

    html += '<div class="wrap" style="padding-block:1rem 1.5rem">';
    html += '<h1 class="sr">' + esc(cat.title) + ' — читать с переводом и транскрипцией</h1>';

    html += '<div class="seg" role="radiogroup" aria-label="Режим чтения">' +
      '<button role="radio" aria-checked="' + (!single) + '" data-act="mode" data-mode="list">Список</button>' +
      '<button role="radio" aria-checked="' + single + '" data-act="mode" data-mode="single">По одному</button></div>';

    if (!view.resumeDismissed && s.completed > 0 && !s.isComplete && s.resumeIndex > 0) {
      html += '<div class="banner fade-up"><p>Продолжить с ' + (s.resumeIndex + 1) + '-го азкара?</p>' +
        '<div style="display:flex;gap:.5rem;flex:none">' +
        '<button class="btn ghost" data-act="resume-no">Не сейчас</button>' +
        '<button class="btn primary" data-act="resume" data-index="' + s.resumeIndex + '">Продолжить ' + I.right(16) + '</button></div></div>';
    }

    if (s.isComplete) {
      html += '<div class="banner fade-up"><p style="display:flex;align-items:center;gap:.5rem">' + I.check(20) + 'Раздел прочитан полностью</p>' +
        '<button class="btn secondary" data-act="reset-cat">' + I.refresh(16) + 'Начать заново</button></div>';
    }

    if (single) {
      var current = list[view.index];
      html += '<div class="cards" id="cards">' + cardHtml(current, view.index + 1, list.length, cat.slug, { single: true }) + '</div>';
      html += '<nav class="pager" aria-label="Навигация по азкарам">' +
        '<button class="btn secondary" data-act="prev"' + (view.index === 0 ? ' disabled' : '') + ' aria-label="Предыдущий азкар">' + I.left(20) + 'Назад</button>' +
        '<span class="pos">' + (view.index + 1) + ' / ' + list.length + '</span>' +
        '<button class="btn secondary" data-act="next"' + (view.index >= list.length - 1 ? ' disabled' : '') + ' aria-label="Следующий азкар">Далее' + I.right(20) + '</button>' +
        '</nav>';
    } else {
      html += '<div class="cards" id="cards">';
      list.forEach(function (a, i) { html += cardHtml(a, i + 1, list.length, cat.slug, null); });
      html += '</div>';
      html += '<div style="display:flex;justify-content:center;margin-top:1rem"><button class="btn ghost" data-act="reset-cat">' + I.refresh(16) + 'Начать раздел заново</button></div>';
    }

    html += '</div>';
    return html;
  }

  function renderFavorites() {
    var items = favorites.slice().reverse().map(function (id) { return BY_ID[id]; }).filter(Boolean);
    var html = '<div class="wrap" style="padding-block:.5rem 1.5rem"><h1 style="font-size:1.75rem;line-height:1.2">Избранное</h1>';
    if (!items.length) {
      html += '<div class="empty"><p class="big" aria-hidden="true">❤️</p><h2>Здесь пока пусто</h2>' +
        '<p>Нажмите на сердечко у любого азкара — и он появится здесь, чтобы всегда быть под рукой.</p>' +
        '<a class="btn primary" href="#/" style="margin-top:1.25rem">Выбрать раздел</a></div>';
    } else {
      html += '<p style="margin-top:.5rem;color:var(--muted);font-weight:500">' + items.length + ' ' + plural(items.length, ['запись', 'записи', 'записей']) + '</p>';
      html += '<div class="cards">' + items.map(miniHtml).join('') + '</div>';
    }
    return html + '</div>';
  }

  var SUGGESTIONS = ['защита', 'тревога', 'прощение', 'сон', 'дорога', 'дети', 'болезнь', 'коран'];
  var searchQuery = '';

  function normalize(value) {
    return String(value).toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
  }

  var INDEX = ALL.map(function (a) {
    var cat = CAT_BY_ID[a.category];
    return {
      azkar: a,
      fields: [
        { text: normalize(a.title), w: 12 },
        { text: normalize(a.tags.join(' ')), w: 9 },
        { text: normalize(cat.title + ' ' + cat.shortTitle), w: 7 },
        { text: normalize(a.translation), w: 5 },
        { text: normalize(a.source.collection + ' ' + (a.source.reference || '') + ' ' + (a.sourceDetails || '')), w: 4 },
        { text: normalize(a.transliteration), w: 3 }
      ]
    };
  });

  function runSearch(raw) {
    var q = normalize(raw);
    if (q.length < 2) return [];
    var words = q.split(' ').filter(Boolean);
    var out = [];
    INDEX.forEach(function (entry) {
      var score = 0;
      var matched = 0;
      words.forEach(function (word) {
        var hit = false;
        entry.fields.forEach(function (field) {
          var at = field.text.indexOf(word);
          if (at < 0) return;
          hit = true;
          score += field.w * (at === 0 || field.text[at - 1] === ' ' ? 1.5 : 1);
        });
        if (hit) matched += 1;
      });
      if (matched !== words.length) return;
      if (entry.azkar.verified) score += 1;
      out.push({ azkar: entry.azkar, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score || a.azkar.id.localeCompare(b.azkar.id); });
    return out;
  }

  function renderSearch() {
    var html = '<div class="wrap" style="padding-block:.5rem 1.5rem"><h1 style="font-size:1.75rem;line-height:1.2">Поиск</h1>';
    html += '<div class="search-field"><span class="lead" style="position:absolute;top:50%;inset-inline-start:1rem;transform:translateY(-50%);color:var(--subtle);pointer-events:none">' + I.search(20) + '</span>' +
      '<input id="q" type="search" autocomplete="off" enterkeyhint="search" aria-label="Поиск по азкарам" placeholder="Например: защита, тревога, Муслим" value="' + esc(searchQuery) + '"></div>';

    if (normalize(searchQuery).length < 2) {
      html += '<p class="eyebrow" style="display:block;margin-top:1.5rem">Попробуйте</p><div class="chips">';
      SUGGESTIONS.forEach(function (s) { html += '<button data-act="suggest" data-q="' + esc(s) + '">' + esc(s) + '</button>'; });
      html += '</div>';
    } else {
      var results = runSearch(searchQuery);
      html += '<p aria-live="polite" style="margin-top:1rem;color:var(--muted);font-weight:600;font-size:.875rem">' +
        (results.length ? results.length + ' ' + plural(results.length, ['результат', 'результата', 'результатов']) : 'Ничего не найдено') + '</p>';
      if (!results.length) {
        html += '<p style="margin-top:.5rem;color:var(--subtle);font-weight:500;line-height:1.6">Попробуйте другое слово — например, «защита», «прощение» или название сборника.</p>';
      } else {
        html += '<div class="cards">' + results.map(function (r) { return miniHtml(r.azkar); }).join('') + '</div>';
      }
    }
    return html + '</div>';
  }

  function renderAbout() {
    var byCat = {};
    ALL.forEach(function (a) { if (!a.verified) byCat[a.category] = (byCat[a.category] || 0) + 1; });

    var html = '<div class="wrap" style="padding-block:.5rem 1.5rem"><h1 style="font-size:1.75rem;line-height:1.2">О проекте</h1>';
    html += '<p class="prose">AZKAR — приложение для ежедневного чтения азкаров: арабский текст, русский перевод, транскрипция, счётчик повторов и сохранение прогресса. Это демонстрационная веб-версия; основное приложение на Next.js дополнительно умеет работать офлайн и устанавливаться на главный экран.</p>';

    html += '<h2 style="margin-top:2rem;font-size:1.25rem">Откуда тексты</h2>';
    html += '<p class="prose">Коранические аяты приводятся с точной ссылкой «сура: аят» — такие записи помечены как проверенные. Переводы на русский сделаны для этого проекта и являются смысловыми: они не заменяют тафсир и не копируют чужие издания.</p>';

    html += '<h2 style="margin-top:2rem;font-size:1.25rem">Что означают пометки</h2><div class="stack">';
    html += '<div class="mini">' + badge(true) + '<p class="prose" style="margin-top:.5rem">Текст и ссылка выверены. Сейчас это ' + DATA.stats.verified + ' из ' + DATA.stats.total + ' записей — в основном аяты Корана, где ссылка однозначна.</p></div>';
    html += '<div class="mini">' + badge(false) + '<p class="prose" style="margin-top:.5rem">Текст приведён и название сборника указано, но точный номер хадиса намеренно не проставлен: выдуманная ссылка хуже отсутствующей. Таких записей ' + DATA.stats.needsReview + '. Перед тем как опираться на них, сверьтесь с печатным изданием или спросите знающего человека.</p></div>';
    html += '</div>';

    html += '<h2 style="margin-top:2rem;font-size:1.25rem">Что требует проверки</h2><ul class="stack" style="gap:.375rem">';
    CATS.forEach(function (c) {
      if (!byCat[c.id]) return;
      html += '<li style="display:flex;justify-content:space-between;gap:.75rem;align-items:center;padding:.625rem 1rem;border-radius:.75rem;background:var(--inset)">' +
        '<a href="#/c/' + c.slug + '" style="font-weight:700;font-size:.9375rem">' + c.emoji + ' ' + esc(c.title) + '</a>' +
        '<span style="flex:none;font-weight:700;font-size:.875rem;color:var(--warn);font-variant-numeric:tabular-nums">' + byCat[c.id] + '</span></li>';
    });
    html += '</ul>';

    return html + '</div>';
  }

  function renderNotFound() {
    return '<div class="wrap" style="padding-block:3rem;text-align:center">' +
      '<p aria-hidden="true" style="font-size:3.5rem;line-height:1;font-weight:800;color:var(--accent-soft-2)">404</p>' +
      '<h1 style="margin-top:.75rem;font-size:1.5rem">Такой страницы нет</h1>' +
      '<p style="margin:.5rem auto 0;max-width:22rem;color:var(--muted);font-weight:500;line-height:1.6">Возможно, ссылка устарела.</p>' +
      '<a class="btn primary" href="#/" style="margin-top:1.5rem">На главную</a></div>';
  }

  /* ================= НАСТРОЙКИ ================= */
  function toggleRow(key, label, note, disabled) {
    return '<button class="row" role="switch" aria-checked="' + settings[key] + '" data-act="toggle" data-key="' + key + '"' + (disabled ? ' disabled' : '') + '>' +
      '<span class="lbl"><b>' + esc(label) + '</b>' + (note ? '<small>' + esc(note) + '</small>' : '') + '</span>' +
      '<span class="switch" aria-hidden="true"><i></i></span></button>';
  }

  function stepperRow(key, label, preview, previewStyle) {
    var value = settings[key];
    return '<div class="row" style="display:block"><div style="display:flex;align-items:center;justify-content:space-between;gap:1rem">' +
      '<span style="font-size:.9375rem;font-weight:600">' + esc(label) + '</span>' +
      '<span class="stepper"><button data-act="step" data-key="' + key + '" data-delta="-1"' + (value <= -2 ? ' disabled' : '') + ' aria-label="Уменьшить: ' + esc(label) + '">A−</button>' +
      '<span class="val" aria-live="polite">' + (value > 0 ? '+' + value : value) + '</span>' +
      '<button data-act="step" data-key="' + key + '" data-delta="1"' + (value >= 3 ? ' disabled' : '') + ' aria-label="Увеличить: ' + esc(label) + '" style="font-size:1.125rem">A+</button></span>' +
      '</div><p class="preview" style="' + previewStyle + '">' + preview + '</p></div>';
  }

  var confirmReset = false;

  function sheetHtml() {
    var html = '<div class="sheet-root" data-act="sheet-bg-wrap"><div class="sheet-bg" data-act="close-sheet"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-head"><div style="flex:1;min-width:0"><div class="sheet-grab" aria-hidden="true"></div>' +
      '<h2 id="sheet-title">Настройки</h2><p>Сохраняются в этом браузере</p></div>' +
      '<button class="iconbtn" data-act="close-sheet" aria-label="Закрыть" style="background:var(--surface-2);margin-top:.75rem">' + I.close(20) + '</button></div>' +
      '<div class="sheet-body">';

    html += '<span class="eyebrow">Оформление</span>';
    html += '<div class="row" style="display:block"><p style="font-size:.9375rem;font-weight:600;margin-bottom:.5rem">Тема оформления</p>' +
      '<div class="seg" role="radiogroup" aria-label="Тема оформления">' +
      ['auto', 'light', 'dark'].map(function (t, i) {
        var names = ['Авто', 'Светлая', 'Тёмная'];
        return '<button role="radio" aria-checked="' + (settings.theme === t) + '" data-act="theme" data-theme="' + t + '">' + names[i] + '</button>';
      }).join('') + '</div></div>';

    html += '<span class="eyebrow">Размер текста</span>';
    html += stepperRow('ar', 'Арабский текст', 'بِسْمِ اللَّهِ',
      "font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;line-height:1.9;font-size:" + AR_SIZE[settings.ar]);
    html += stepperRow('tr', 'Русский перевод', 'Хвала Аллаху, Господу миров.',
      'font-weight:600;line-height:1.6;font-size:' + TR_SIZE[settings.tr]);

    html += '<span class="eyebrow">Что показывать</span>';
    html += toggleRow('showTranslation', 'Перевод', 'Русский текст под арабским', false);
    html += toggleRow('showTranslit', 'Транскрипция', 'Кириллическое чтение арабского текста', false);

    html += '<span class="eyebrow">Чтение</span>';
    html += toggleRow('vibration', 'Вибрация', 'Короткий отклик при нажатии счётчика', false);
    html += toggleRow('autoAdvance', 'Автопереход', 'Переходить к следующему азкару после последнего повтора', false);

    html += '<span class="eyebrow">Данные</span><div style="display:flex;flex-direction:column;gap:.5rem;padding:.25rem 1rem 1rem">';
    html += '<button class="btn secondary full" data-act="clear-fav">Очистить избранное</button>';
    if (confirmReset) {
      html += '<div style="padding:.75rem;border:1px solid var(--line);border-radius:1rem;background:var(--inset)">' +
        '<p style="font-size:.875rem;font-weight:600;line-height:1.4;margin-bottom:.625rem">Сбросить весь прогресс и серию дней? Это действие нельзя отменить.</p>' +
        '<div style="display:flex;gap:.5rem"><button class="btn secondary full" data-act="reset-no">Отмена</button>' +
        '<button class="btn danger full" data-act="reset-yes">Сбросить</button></div></div>';
    } else {
      html += '<button class="btn secondary full" data-act="reset-ask">Сбросить весь прогресс</button>';
    }
    html += '<button class="btn ghost full" data-act="reset-settings">Вернуть настройки по умолчанию</button>';
    html += '</div>';

    html += '</div></div></div>';
    return html;
  }

  var sheetOpen = false;
  var lastFocused = null;

  function renderSheet() {
    var host = document.getElementById('sheet-host');
    host.innerHTML = sheetOpen ? sheetHtml() : '';
    if (sheetOpen) {
      var first = host.querySelector('button');
      if (first) first.focus();
    }
    renderChrome();
  }

  function openSheet() {
    lastFocused = document.activeElement;
    sheetOpen = true;
    confirmReset = false;
    document.body.style.overflow = 'hidden';
    renderSheet();
  }

  function closeSheet() {
    sheetOpen = false;
    document.body.style.overflow = '';
    renderSheet();
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  /* ================= КАРКАС ================= */
  function renderChrome() {
    var top = document.getElementById('topbar');
    top.innerHTML = route.name === 'home'
      ? '<a class="brand" href="#/">AZKAR</a>' +
        '<span class="spacer"></span>' +
        '<a class="iconbtn" href="#/search" aria-label="Поиск по азкарам">' + I.search(20) + '</a>' +
        '<button class="iconbtn" data-act="open-sheet" aria-haspopup="dialog" aria-expanded="' + sheetOpen + '" aria-label="Настройки">' + I.gear(20) + '</button>'
      : '<button class="iconbtn" data-act="back" aria-label="Назад" style="margin-inline-start:-.5rem">' + I.back(20) + '</button>' +
        '<span class="spacer"></span>' +
        '<a class="iconbtn" href="#/search" aria-label="Поиск по азкарам">' + I.search(20) + '</a>' +
        '<button class="iconbtn" data-act="open-sheet" aria-haspopup="dialog" aria-expanded="' + sheetOpen + '" aria-label="Настройки">' + I.gear(20) + '</button>';

    var nav = document.getElementById('bottomnav');
    var items = [
      { href: '#/', label: 'Главная', icon: I.home(22), on: route.name === 'home' },
      { href: '#/search', label: 'Азкары', icon: I.beads(22), on: route.name === 'category' || route.name === 'search' },
      { href: '#/favorites', label: 'Избранное', icon: null, on: route.name === 'favorites' }
    ];
    nav.innerHTML = items.map(function (it) {
      var icon = it.icon || I.heart(22, it.on);
      return '<li><a href="' + it.href + '"' + (it.on ? ' aria-current="page"' : '') + '>' + icon + it.label + '</a></li>';
    }).join('') +
      '<li><button data-act="open-sheet" class="' + (sheetOpen ? 'active' : '') + '" aria-haspopup="dialog" aria-expanded="' + sheetOpen + '">' + I.gear(22) + 'Настройки</button></li>';
  }

  function render(keepScroll) {
    var y = window.scrollY;
    var host = document.getElementById('view');
    if (route.name === 'home') host.innerHTML = renderHome();
    else if (route.name === 'category') host.innerHTML = renderCategory(route.slug);
    else if (route.name === 'favorites') host.innerHTML = renderFavorites();
    else if (route.name === 'search') host.innerHTML = renderSearch();
    else if (route.name === 'about') host.innerHTML = renderAbout();
    else host.innerHTML = renderNotFound();
    renderChrome();
    if (keepScroll) window.scrollTo(0, y);
  }

  function onRouteChange() {
    var next = parseHash();
    var changedCategory = next.name !== route.name || next.slug !== route.slug;
    route = next;
    if (changedCategory) {
      view = { index: 0, resumeDismissed: false, openTranslit: {} };
      searchQuery = '';
    }
    render(false);
    window.scrollTo(0, 0);
    if (route.name === 'search') {
      var input = document.getElementById('q');
      if (input) input.focus();
    }
  }

  /* ================= СЧЁТЧИК ================= */
  var COOLDOWN = 220;
  var lastTap = 0;

  function refreshProgressHeader() {
    if (route.name !== 'category') return;
    var s = summary(CAT_BY_SLUG[route.slug].id);
    var num = document.getElementById('prog-num');
    var bar = document.getElementById('prog-bar');
    if (num) num.innerHTML = s.completed + ' <i>из</i> ' + s.total;
    if (bar) bar.innerHTML = progressBar(s.ratio, 'Прогресс раздела');
  }

  function handleCount(id, position) {
    var now = Date.now();
    // Защита от случайного двойного тапа: слишком быстрый повтор игнорируется.
    if (now - lastTap < COOLDOWN) return;
    lastTap = now;

    var azkar = BY_ID[id];
    var target = Math.max(1, azkar.repetitions);
    var state;

    writeProgress(azkar.category, function (next) {
      var current = next.counters[id] || { count: 0, done: false };
      var count = Math.min(current.count + 1, target);
      state = { count: count, done: count >= target };
      next.counters[id] = state;
      next.last = id;
    });

    if (state.done) {
      var list = DATA.azkar[azkar.category] || [];
      var p = catProgress(azkar.category);
      var all = list.every(function (a) { return p.counters[a.id] && p.counters[a.id].done; });
      if (all) recordCompletion(azkar.category);
      vibrate([18, 40, 24]);
    } else {
      vibrate(12);
    }

    // Точечное обновление вместо полной перерисовки — иначе теряется позиция скролла.
    var card = document.querySelector('[data-card="' + id + '"]');
    if (card) {
      var button = card.querySelector('[data-act="count"]');
      button.innerHTML = counterInner(azkar, state);
      if (state.done) {
        button.setAttribute('disabled', '');
        card.classList.add('done');
      }
      var row = card.querySelector('.counter-row');
      if (state.count > 0 && !row.querySelector('[data-act="uncount"]')) {
        var reset = document.createElement('button');
        reset.className = 'counter-reset';
        reset.setAttribute('data-act', 'uncount');
        reset.setAttribute('data-id', id);
        reset.setAttribute('aria-label', 'Сбросить счётчик этого азкара');
        reset.innerHTML = I.refresh(20);
        row.appendChild(reset);
      }
      var live = card.querySelector('[role="status"]');
      if (live) live.textContent = 'Выполнено ' + state.count + ' из ' + target;
    }

    refreshProgressHeader();

    if (state.done && settings.autoAdvance) {
      var list2 = DATA.azkar[azkar.category] || [];
      if (position + 1 < list2.length) {
        setTimeout(function () {
          if (settings.mode === 'single') {
            view.index = position + 1;
            render(false);
            window.scrollTo(0, 0);
          } else {
            var nextCard = document.querySelector('[data-card="' + list2[position + 1].id + '"]');
            if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 480);
      } else if (settings.mode === 'list') {
        render(true);
      }
    } else if (state.done) {
      render(true);
    }
  }

  /* ================= СОБЫТИЯ ================= */
  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'count') { handleCount(el.getAttribute('data-id'), Number(el.getAttribute('data-pos'))); return; }

    if (act === 'uncount') {
      var uid = el.getAttribute('data-id');
      writeProgress(BY_ID[uid].category, function (next) { next.counters[uid] = { count: 0, done: false }; });
      render(true);
      return;
    }

    if (act === 'fav') {
      toggleFav(el.getAttribute('data-id'));
      vibrate(12);
      render(true);
      return;
    }

    if (act === 'translit') {
      var tid = el.getAttribute('data-id');
      view.openTranslit[tid] = !view.openTranslit[tid];
      render(true);
      return;
    }

    if (act === 'share') {
      var a = BY_ID[el.getAttribute('data-id')];
      var text = a.title + '\n\n' + a.translation + '\n\nИсточник: ' + a.source.collection +
        (a.source.reference ? ', ' + a.source.reference : '') + (a.verified ? '' : '\n(запись требует проверки источника)');
      if (navigator.share) {
        navigator.share({ title: a.title + ' — AZKAR', text: text }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () { toast('Текст скопирован'); }, function () { toast('Не удалось скопировать'); });
      } else {
        toast('Копирование недоступно');
      }
      return;
    }

    if (act === 'mode') { setSetting('mode', el.getAttribute('data-mode')); render(false); window.scrollTo(0, 0); return; }
    if (act === 'resume') { view.resumeDismissed = true; view.index = Number(el.getAttribute('data-index')); render(false); return; }
    if (act === 'resume-no') { view.resumeDismissed = true; render(true); return; }
    if (act === 'reset-cat') {
      var cid = CAT_BY_SLUG[route.slug].id;
      delete progress[cid];
      save(KEY.p, progress);
      view.index = 0;
      view.resumeDismissed = true;
      render(false);
      window.scrollTo(0, 0);
      return;
    }
    if (act === 'prev') { view.index = Math.max(0, view.index - 1); render(false); window.scrollTo(0, 0); return; }
    if (act === 'next') {
      var total = (DATA.azkar[CAT_BY_SLUG[route.slug].id] || []).length;
      view.index = Math.min(total - 1, view.index + 1);
      render(false);
      window.scrollTo(0, 0);
      return;
    }

    if (act === 'suggest') { searchQuery = el.getAttribute('data-q'); render(false); return; }
    // window.history, а не наша переменная history с историей дней.
    if (act === 'back') { if (window.history.length > 1) window.history.back(); else go('#/'); return; }

    if (act === 'open-sheet') { openSheet(); return; }
    if (act === 'close-sheet') { closeSheet(); return; }
    if (act === 'theme') { setSetting('theme', el.getAttribute('data-theme')); renderSheet(); render(true); return; }
    if (act === 'toggle') { var k = el.getAttribute('data-key'); setSetting(k, !settings[k]); renderSheet(); render(true); return; }
    if (act === 'step') {
      var sk = el.getAttribute('data-key');
      var delta = Number(el.getAttribute('data-delta'));
      setSetting(sk, Math.max(-2, Math.min(3, settings[sk] + delta)));
      renderSheet();
      render(true);
      return;
    }
    if (act === 'clear-fav') { favorites = []; save(KEY.f, favorites); toast('Избранное очищено'); render(true); return; }
    if (act === 'reset-ask') { confirmReset = true; renderSheet(); return; }
    if (act === 'reset-no') { confirmReset = false; renderSheet(); return; }
    if (act === 'reset-yes') {
      progress = {}; history = [];
      save(KEY.p, progress); save(KEY.h, history);
      confirmReset = false;
      renderSheet();
      render(true);
      toast('Прогресс сброшен');
      return;
    }
    if (act === 'reset-settings') {
      settings = Object.assign({}, DEFAULTS);
      save(KEY.s, settings);
      applySettings();
      renderSheet();
      render(true);
      return;
    }
  });

  document.addEventListener('input', function (event) {
    if (event.target && event.target.id === 'q') {
      searchQuery = event.target.value;
      var at = event.target.selectionStart;
      render(true);
      var again = document.getElementById('q');
      if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch (e) {} }
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && sheetOpen) { event.preventDefault(); closeSheet(); return; }
    if (event.key !== 'Tab' || !sheetOpen) return;
    // Ловушка фокуса: из открытой шторки нельзя уйти табом на страницу под ней.
    var focusable = document.querySelectorAll('.sheet button:not([disabled]), .sheet a[href], .sheet input');
    if (!focusable.length) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });

  window.addEventListener('hashchange', onRouteChange);

  /* ================= СТАРТ ================= */
  applySettings();
  route = parseHash();
  render(false);
})();
</script>
