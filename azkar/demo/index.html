<title>AZKAR</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">

<style>
  /* ============ ТОКЕНЫ: та же палитра, что и в основном приложении ============ */
  :root {
    color-scheme: light;

    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #f1efe9;
    --surface-3: #e7e4dc;
    --inset: #faf9f6;

    --line: rgb(24 28 26 / 8%);
    --line-strong: rgb(24 28 26 / 14%);

    --ink: #14171a;
    --muted: #55605b;
    --subtle: #7d8884;

    --accent: #0d7a56;
    --accent-hover: #0a6547;
    --accent-soft: #e6f2ec;
    --accent-soft-2: #cfe7dc;
    --on-accent: #ffffff;
    --ring: rgb(13 122 86 / 35%);

    --warn: #9a6207;
    --warn-soft: #faf1de;
    --danger: #a52f2f;
    --danger-soft: #fbeceb;

    --c-emerald: #0d7a56;  --c-emerald-soft: #e6f2ec;
    --c-indigo: #3f4f9e;   --c-indigo-soft: #e9ebf7;
    --c-amber: #96650a;    --c-amber-soft: #faf1de;
    --c-violet: #6a4a99;   --c-violet-soft: #f0eaf8;
    --c-rose: #a6404f;     --c-rose-soft: #fbeaec;
    --c-teal: #0f6f73;     --c-teal-soft: #e3f1f1;
    --c-slate: #4a5560;    --c-slate-soft: #ecedf0;

    --shadow-s: 0 1px 2px rgb(20 23 26 / 5%);
    --shadow-m: 0 2px 8px -2px rgb(20 23 26 / 8%), 0 1px 3px rgb(20 23 26 / 4%);
    --shadow-l: 0 12px 32px -12px rgb(20 23 26 / 18%), 0 2px 8px -4px rgb(20 23 26 / 8%);

    --ar-size: 2rem;
    --ar-lh: 2.15;
    --tr-size: 1.1875rem;
    --nav-h: 4.25rem;
  }

  /* Тёмная тема: сначала системная (если пользователь не выбрал светлую явно)… */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --bg: #0b0d0c;
      --surface: #151917;
      --surface-2: #1c211e;
      --surface-3: #262c29;
      --inset: #101413;
      --line: rgb(255 255 255 / 8%);
      --line-strong: rgb(255 255 255 / 15%);
      --ink: #eceeec;
      --muted: #a0aaa5;
      --subtle: #7c8681;
      --accent: #4cc48e;
      --accent-hover: #63d09e;
      --accent-soft: rgb(76 196 142 / 13%);
      --accent-soft-2: rgb(76 196 142 / 22%);
      --on-accent: #05231a;
      --ring: rgb(76 196 142 / 45%);
      --warn: #e0b168;
      --warn-soft: rgb(224 177 104 / 13%);
      --danger: #e08b85;
      --danger-soft: rgb(224 139 133 / 13%);
      --c-emerald: #4cc48e;  --c-emerald-soft: rgb(76 196 142 / 14%);
      --c-indigo: #96a4ea;   --c-indigo-soft: rgb(150 164 234 / 14%);
      --c-amber: #e0b168;    --c-amber-soft: rgb(224 177 104 / 14%);
      --c-violet: #b79fe8;   --c-violet-soft: rgb(183 159 232 / 14%);
      --c-rose: #e59aa4;     --c-rose-soft: rgb(229 154 164 / 14%);
      --c-teal: #63c2c6;     --c-teal-soft: rgb(99 194 198 / 14%);
      --c-slate: #a6b1bd;    --c-slate-soft: rgb(166 177 189 / 14%);
      --shadow-s: 0 1px 2px rgb(0 0 0 / 40%);
      --shadow-m: 0 2px 10px -2px rgb(0 0 0 / 50%);
      --shadow-l: 0 16px 40px -16px rgb(0 0 0 / 70%);
    }
  }

  /* …затем явный выбор пользователя, который побеждает в обе стороны. */
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #0b0d0c;
    --surface: #151917;
    --surface-2: #1c211e;
    --surface-3: #262c29;
    --inset: #101413;
    --line: rgb(255 255 255 / 8%);
    --line-strong: rgb(255 255 255 / 15%);
    --ink: #eceeec;
    --muted: #a0aaa5;
    --subtle: #7c8681;
    --accent: #4cc48e;
    --accent-hover: #63d09e;
    --accent-soft: rgb(76 196 142 / 13%);
    --accent-soft-2: rgb(76 196 142 / 22%);
    --on-accent: #05231a;
    --ring: rgb(76 196 142 / 45%);
    --warn: #e0b168;
    --warn-soft: rgb(224 177 104 / 13%);
    --danger: #e08b85;
    --danger-soft: rgb(224 139 133 / 13%);
    --c-emerald: #4cc48e;  --c-emerald-soft: rgb(76 196 142 / 14%);
    --c-indigo: #96a4ea;   --c-indigo-soft: rgb(150 164 234 / 14%);
    --c-amber: #e0b168;    --c-amber-soft: rgb(224 177 104 / 14%);
    --c-violet: #b79fe8;   --c-violet-soft: rgb(183 159 232 / 14%);
    --c-rose: #e59aa4;     --c-rose-soft: rgb(229 154 164 / 14%);
    --c-teal: #63c2c6;     --c-teal-soft: rgb(99 194 198 / 14%);
    --c-slate: #a6b1bd;    --c-slate-soft: rgb(166 177 189 / 14%);
    --shadow-s: 0 1px 2px rgb(0 0 0 / 40%);
    --shadow-m: 0 2px 10px -2px rgb(0 0 0 / 50%);
    --shadow-l: 0 16px 40px -16px rgb(0 0 0 / 70%);
  }

  /* ============ БАЗА ============ */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 1.5rem);
  }

  h1, h2, h3 {
    font-family: Manrope, Inter, ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-wrap: balance;
    margin: 0;
  }

  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }

  button {
    font: inherit;
    color: inherit;
    border: none;
    background: none;
    cursor: pointer;
  }

  a { color: inherit; text-decoration: none; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 8px;
  }

  .wrap {
    width: 100%;
    max-width: 44rem;
    margin-inline: auto;
    padding-inline: 1rem;
  }

  .skip {
    position: absolute;
    left: 0.5rem;
    top: 0.5rem;
    z-index: 60;
    padding: 0.5rem 1rem;
    border-radius: 0.75rem;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
  }
  .skip:not(:focus) {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ============ ВЕРХНЯЯ ПАНЕЛЬ ============ */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    height: 3.5rem;
  }
  .brand {
    font-family: Manrope, sans-serif;
    font-weight: 800;
    font-size: 1.375rem;
    letter-spacing: 0.14em;
  }
  .iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    flex: none;
    border-radius: 999px;
    color: var(--muted);
    transition: background-color .15s, color .15s, transform .15s;
  }
  .iconbtn:hover { background: var(--surface-2); color: var(--ink); }
  .iconbtn:active { transform: scale(.92); }
  .spacer { margin-inline-start: auto; }

  /* ============ ГЛАВНАЯ ============ */
  .hello-ar {
    font-family: 'Noto Naskh Arabic', serif;
    direction: rtl;
    text-align: right;
    color: var(--subtle);
    font-size: 0.9375rem;
    font-weight: 600;
  }
  .hello-ru { font-size: 2rem; line-height: 1.15; margin-top: 0.25rem; }
  .hello-sub { margin-top: 0.5rem; color: var(--muted); font-weight: 600; min-height: 1.5rem; }

  .searchlink {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    min-height: 3rem;
    margin-top: 1rem;
    padding-inline: 1rem;
    border: 1px solid var(--line);
    border-radius: 1rem;
    background: var(--surface-2);
    color: var(--subtle);
    font-weight: 600;
    font-size: 0.9375rem;
  }

  .today {
    margin-top: 1rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-s);
  }
  .today-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .eyebrow {
    font-size: 0.6875rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--subtle);
  }
  .streak {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.75rem;
    font-weight: 800;
  }
  .today-list { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; margin-top: 0.75rem; }
  .today-item { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.9375rem; }
  .today-item .num { color: var(--subtle); font-variant-numeric: tabular-nums; }

  .heroes { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
  @media (min-width: 40rem) { .heroes { flex-direction: row; } .hero { flex: 1; } }

  .hero {
    display: block;
    padding: 1.25rem;
    border: 1px solid var(--line);
    border-radius: 1.75rem;
    background: var(--surface);
    box-shadow: var(--shadow-m);
    transition: box-shadow .2s, transform .2s;
  }
  .hero:hover { box-shadow: var(--shadow-l); }
  .hero:active { transform: scale(.99); }
  .hero-top { display: flex; align-items: flex-start; gap: 1rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    border-radius: 1rem;
    color: var(--chip-fg, var(--accent));
    background: var(--chip-bg, var(--accent-soft));
  }
  .chip.lg { width: 3.5rem; height: 3.5rem; font-size: 1.75rem; }
  .chip.sm { width: 2.5rem; height: 2.5rem; font-size: 1.25rem; border-radius: 0.75rem; }
  .chip.xs { width: 1.25rem; height: 1.25rem; font-size: 0.6875rem; border-radius: 0.375rem; }
  .hero h3 { font-size: 1.25rem; line-height: 1.2; }
  .hero .count { margin-top: 0.25rem; color: var(--muted); font-weight: 600; font-size: 0.875rem; }
  .hero .go {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    margin-top: 1rem;
    color: var(--accent);
    font-weight: 800;
    font-size: 0.9375rem;
  }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
  @media (min-width: 40rem) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .tile {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 6.5rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-s);
    transition: box-shadow .2s, transform .2s;
  }
  .tile:hover { box-shadow: var(--shadow-m); }
  .tile:active { transform: scale(.98); }
  .tile.dashed { border-style: dashed; border-color: var(--line-strong); background: transparent; box-shadow: none; }
  .tile h3 { font-size: 0.9375rem; line-height: 1.2; }
  .tile .count { margin-top: 0.125rem; color: var(--subtle); font-weight: 600; font-size: 0.75rem; }

  .done-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem; height: 1.5rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ============ ЗАГОЛОВОК РАЗДЕЛА ============ */
  .prog {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 3.5rem);
    z-index: 25;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .prog-in { padding-block: 0.75rem; }
  .prog-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
  .prog-title { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9375rem; font-weight: 800; min-width: 0; }
  .prog-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prog-num { flex: none; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.9375rem; }
  .prog-num i { font-style: normal; color: var(--subtle); }
  .bar { height: 0.375rem; margin-top: 0.5rem; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s ease-out; }

  /* ============ СЕГМЕНТЫ ============ */
  .seg {
    display: flex;
    gap: 0.25rem;
    padding: 0.25rem;
    border-radius: 1rem;
    background: var(--surface-2);
  }
  .seg button {
    flex: 1;
    height: 2.5rem;
    border-radius: 0.75rem;
    font-weight: 700;
    font-size: 0.9375rem;
    color: var(--muted);
    transition: background-color .2s, color .2s, box-shadow .2s;
  }
  .seg button[aria-checked='true'] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-s); }
  .seg.sm button { height: 2.25rem; font-size: 0.875rem; }

  /* ============ КАРТОЧКА АЗКАРА ============ */
  .cards { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }

  .card {
    padding: 1.25rem;
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-s);
    transition: border-color .3s, background-color .3s;
  }
  .card.done { border-color: var(--accent-soft-2); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
  .card-meta {
    font-size: 0.8125rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--subtle);
  }
  .card-meta .dot { opacity: .4; margin-inline: 0.375rem; }
  .card-meta .reps { text-transform: none; }
  .card h3 { margin-top: 0.25rem; font-size: 1.0625rem; line-height: 1.3; font-weight: 700; font-family: Inter, sans-serif; letter-spacing: -0.01em; }
  .card-actions { display: flex; flex: none; margin-inline-end: -0.5rem; }

  .arabic {
    margin-top: 1.25rem;
    font-family: 'Noto Naskh Arabic', 'Traditional Arabic', serif;
    font-size: var(--ar-size);
    line-height: var(--ar-lh);
    font-weight: 500;
    direction: rtl;
    text-align: right;
    unicode-bidi: isolate;
    word-spacing: 0.06em;
    overflow-wrap: break-word;
  }

  .translation { margin-top: 1.25rem; font-size: var(--tr-size); line-height: 1.65; font-weight: 600; }

  .translit-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    min-height: 2.75rem;
    margin-top: 0.75rem;
    margin-inline-start: -0.5rem;
    padding-inline: 0.5rem;
    border-radius: 0.75rem;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--muted);
  }
  .translit-toggle:hover { color: var(--ink); }
  .translit-toggle .caret { transition: transform .2s; }
  .translit-toggle[aria-expanded='true'] .caret { transform: rotate(180deg); }
  .translit {
    margin-top: 0.25rem;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    background: var(--inset);
    color: var(--muted);
    font-weight: 500;
    line-height: 1.6;
  }

  .source { margin-top: 1rem; padding: 0.875rem 1rem; border-radius: 1rem; background: var(--inset); }
  .source-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .source-name { margin-top: 0.5rem; font-size: 0.9375rem; font-weight: 600; line-height: 1.35; }
  .source-name i { font-style: normal; color: var(--muted); }
  .source-note { margin-top: 0.375rem; font-size: 0.8125rem; font-weight: 500; line-height: 1.4; color: var(--subtle); }
  .source-warn { margin-top: 0.5rem; font-size: 0.8125rem; font-weight: 500; line-height: 1.4; color: var(--warn); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    margin-inline-start: auto;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .badge.ok { background: var(--accent-soft); color: var(--accent); }
  .badge.review { background: var(--warn-soft); color: var(--warn); }

  .counter-row { display: flex; align-items: stretch; gap: 0.5rem; margin-top: 1rem; }
  .counter {
    position: relative;
    flex: 1;
    min-height: 4rem;
    padding-inline: 1.25rem;
    border-radius: 1rem;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 800;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    box-shadow: var(--shadow-s);
    transition: transform .15s, background-color .15s;
  }
  .counter:hover { background: var(--accent-hover); }
  .counter:active { transform: scale(.985); }
  .counter[disabled] { background: var(--accent-soft); color: var(--accent); cursor: default; transform: none; box-shadow: none; }
  .counter .fill {
    position: absolute;
    inset-block: 0;
    inset-inline-start: 0;
    background: rgb(0 0 0 / 10%);
    transition: width .3s ease-out;
  }
  :root[data-theme='dark'] .counter .fill { background: rgb(255 255 255 / 10%); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) .counter .fill { background: rgb(255 255 255 / 10%); }
  }
  .counter .lbl { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.625rem; }
  .counter .pop { display: inline-block; animation: pop .28s cubic-bezier(.34,1.4,.64,1); }

  .counter-reset {
    flex: none;
    width: 3.5rem;
    min-height: 4rem;
    border: 1px solid var(--line);
    border-radius: 1rem;
    background: var(--surface-2);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color .15s, color .15s, transform .15s;
  }
  .counter-reset:hover { background: var(--surface-3); color: var(--ink); }
  .counter-reset:active { transform: scale(.95); }

  .audio-note {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    background: var(--inset);
    color: var(--subtle);
    font-size: 0.8125rem;
    font-weight: 600;
  }

  /* ============ БАННЕРЫ ============ */
  .banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
    padding: 0.875rem 1rem;
    border: 1px solid var(--accent-soft-2);
    border-radius: 1.5rem;
    background: var(--accent-soft);
  }
  .banner p { flex: 1; min-width: 10rem; font-weight: 700; font-size: 0.9375rem; line-height: 1.3; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 2.75rem;
    padding-inline: 1rem;
    border-radius: 0.875rem;
    font-weight: 700;
    font-size: 0.9375rem;
    transition: background-color .15s, transform .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .btn.secondary:hover { background: var(--surface-3); }
  .btn.ghost { color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.full { width: 100%; }

  /* ============ РЕЖИМ «ПО ОДНОМУ» ============ */
  .pager {
    position: sticky;
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + 0.5rem);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
    padding: 0.5rem;
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-l);
  }
  /* flex-basis 0 + min-width:0 — чтобы пейджер не распирал экран,
     если шрифт не загрузился и текст рисуется более широким фолбэком. */
  .pager .btn { flex: 1 1 0; min-width: 0; padding-inline: 0.625rem; }
  .pager .btn[disabled] { opacity: .45; pointer-events: none; }
  .pager .pos { flex: none; padding-inline: 0.25rem; font-weight: 800; font-size: 0.9375rem; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* ============ НИЖНЯЯ НАВИГАЦИЯ ============ */
  .bottomnav {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 40;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bottomnav ul { display: flex; max-width: 32rem; margin-inline: auto; }
  .bottomnav li { flex: 1; }
  .bottomnav a, .bottomnav button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    width: 100%;
    height: var(--nav-h);
    border-radius: 1rem;
    font-size: 0.6875rem;
    font-weight: 700;
    color: var(--subtle);
    transition: color .15s;
  }
  .bottomnav a:hover, .bottomnav button:hover { color: var(--muted); }
  .bottomnav [aria-current='page'], .bottomnav .active { color: var(--accent); }

  /* ============ ШТОРКА НАСТРОЕК ============ */
  .sheet-root { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 40rem) { .sheet-root { align-items: center; } }
  .sheet-bg { position: absolute; inset: 0; background: rgb(0 0 0 / 45%); backdrop-filter: blur(2px); animation: fade .25s ease-out; }
  .sheet {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-height: 88dvh;
    border-radius: 1.75rem 1.75rem 0 0;
    background: var(--surface);
    box-shadow: var(--shadow-l);
    overflow: hidden;
    animation: up .3s cubic-bezier(.22,1,.36,1);
  }
  @media (min-width: 40rem) { .sheet { max-width: 32rem; border-radius: 1.75rem; } }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
  .sheet-grab { width: 2.5rem; height: 0.25rem; margin: 0 auto 0.75rem; border-radius: 999px; background: var(--surface-3); }
  @media (min-width: 40rem) { .sheet-grab { display: none; } }
  .sheet-head h2 { font-size: 1.25rem; }
  .sheet-head p { margin-top: 0.25rem; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0.75rem 0.75rem calc(1rem + env(safe-area-inset-bottom, 0px)); }
  .sheet-body .eyebrow { display: block; margin: 1rem 0 0.25rem; padding-inline: 1rem; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    width: 100%;
    min-height: 3.5rem;
    padding: 0.875rem 1rem;
    border-radius: 1rem;
    text-align: start;
    transition: background-color .15s;
  }
  button.row:hover { background: var(--surface-2); }
  .row .lbl { min-width: 0; }
  .row .lbl b { display: block; font-size: 0.9375rem; font-weight: 600; }
  .row .lbl small { display: block; margin-top: 0.125rem; font-size: 0.8125rem; font-weight: 500; line-height: 1.3; color: var(--subtle); }
  .row[disabled] { opacity: .45; pointer-events: none; }

  .switch { position: relative; flex: none; width: 3.25rem; height: 1.75rem; border-radius: 999px; background: var(--surface-3); transition: background-color .2s; }
  .row[aria-checked='true'] .switch { background: var(--accent); }
  .switch i { position: absolute; top: 0.125rem; left: 0.125rem; width: 1.5rem; height: 1.5rem; border-radius: 999px; background: #fff; box-shadow: var(--shadow-s); transition: left .2s ease-out; }
  .row[aria-checked='true'] .switch i { left: 1.625rem; }

  .stepper { display: flex; align-items: center; gap: 0.5rem; }
  .stepper button {
    width: 3rem; height: 3rem;
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    background: var(--surface);
    font-weight: 800;
    transition: background-color .15s, transform .15s;
  }
  .stepper button:hover { background: var(--surface-2); }
  .stepper button:active { transform: scale(.95); }
  .stepper button[disabled] { opacity: .4; pointer-events: none; }
  .stepper .val { width: 2.25rem; text-align: center; font-weight: 700; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .preview { margin-top: 0.75rem; padding: 0.625rem 0.75rem; border-radius: 0.75rem; background: var(--inset); }

  /* ============ ПОИСК ============ */
  .search-field { position: relative; margin-top: 1rem; }
  .search-field svg.lead { position: absolute; top: 50%; inset-inline-start: 1rem; transform: translateY(-50%); color: var(--subtle); pointer-events: none; }
  .search-field input {
    width: 100%;
    height: 3.5rem;
    padding-inline: 3rem;
    border: 1px solid var(--line);

    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-weight: 600;
  }
  .search-field input::placeholder { color: var(--subtle); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.625rem; }
  .chips button {
    min-height: 2.75rem;
    padding-inline: 1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    font-weight: 700;
    font-size: 0.9375rem;
  }
  .chips button:hover { background: var(--surface-3); color: var(--ink); }

  .mini { padding: 1rem; border: 1px solid var(--line); border-radius: 1.5rem; background: var(--surface); box-shadow: var(--shadow-s); }
  .mini-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
  .mini-cat { display: inline-flex; align-items: center; gap: 0.375rem; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--subtle); }
  .mini h3 { margin-top: 0.375rem; font-family: Inter, sans-serif; font-size: 1.0625rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
  .mini .arabic { margin-top: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-clamp: 2; overflow: hidden; }
  .mini .excerpt { margin-top: 0.75rem; color: var(--muted); font-weight: 600; font-size: 0.9375rem; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-clamp: 3; overflow: hidden; }
  .mini-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.75rem; }
  .mini-foot .src { font-size: 0.8125rem; font-weight: 600; color: var(--subtle); }

  .empty { margin-top: 1.5rem; padding: 2.5rem 1.25rem; border: 1px dashed var(--line-strong); border-radius: 1.5rem; text-align: center; }
  .empty .big { font-size: 1.875rem; }
  .empty h2 { margin-top: 0.75rem; font-size: 1.0625rem; font-family: Inter, sans-serif; font-weight: 700; }
  .empty p { margin: 0.5rem auto 0; max-width: 24rem; color: var(--muted); font-weight: 500; line-height: 1.6; font-size: 0.9375rem; }

  .prose { margin-top: 0.75rem; color: var(--muted); font-weight: 500; line-height: 1.7; }
  .prose + h2 { margin-top: 2rem; font-size: 1.25rem; }
  .stack { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.75rem; }

  .fav-on { color: var(--danger); }

  /* ============ АНИМАЦИИ ============ */
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .fade-up { animation: up .32s cubic-bezier(.22,1,.36,1) both; }

  .toast {
    position: fixed;
    inset-inline: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + 0.75rem);
    z-index: 60;
    display: flex;
    justify-content: center;
    padding-inline: 1rem;
    pointer-events: none;
  }
  .toast span { padding: 0.625rem 1rem; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 0.875rem; box-shadow: var(--shadow-l); }

  @media (prefers-reduced-motion: reduce) {

  var DATA = {"categories":[{"id":"morning","slug":"morning","title":"Утренние азкары","shortTitle":"Утренние","emoji":"🌅","accent":"emerald","count":23},{"id":"evening","slug":"evening","title":"Вечерние азкары","shortTitle":"Вечерние","emoji":"🌙","accent":"indigo","count":22},{"id":"after-prayer","slug":"after-prayer","title":"После намаза","shortTitle":"После намаза","emoji":"📿","accent":"teal","count":13},{"id":"sleep","slug":"sleep","title":"Перед сном","shortTitle":"Перед сном","emoji":"🛏️","accent":"violet","count":12},{"id":"waking","slug":"waking","title":"После пробуждения","shortTitle":"Пробуждение","emoji":"☀️","accent":"amber","count":4},{"id":"protection","slug":"protection","title":"Защитные дуа","shortTitle":"Защита","emoji":"🛡️","accent":"rose","count":9},{"id":"quran-duas","slug":"quran-duas","title":"Дуа из Корана","shortTitle":"Из Корана","emoji":"📖","accent":"slate","count":14},{"id":"prophet-duas","slug":"prophet-duas","title":"Дуа пророка ﷺ","shortTitle":"Дуа пророка","emoji":"🕌","accent":"emerald","count":10},{"id":"situations","slug":"situations","title":"Жизненные ситуации","shortTitle":"Ситуации","emoji":"🧭","accent":"amber","count":15}],"azkar":{"morning":[{"id":"morning-01-ayat-al-kursi","category":"morning","order":1,"title":"Аят аль-Курси","arabic":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","translation":"Аллах — нет божества, кроме Него, Живого, Вечносущего. Не овладевают Им ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто заступится перед Ним без Его дозволения? Он знает их прошлое и их будущее, а они постигают из Его знания лишь то, что Он пожелает. Престол Его объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.","transliteration":"Аллаху ля иляха илля Хуа-ль-Хаййу-ль-Каййум. Ля та'хузуху синатун ва ля наум. Ляху ма фи-с-самавати ва ма фи-ль-ард. Ман заллязи яшфа'у 'индаху илля би-изних. Я'ляму ма байна айдихим ва ма хальфахум, ва ля юхитуна би-шайин мин 'ильмихи илля бима ша'а. Васи'а курсиййуху-с-самавати ва-ль-ард, ва ля я'удуху хифзухума, ва Хуа-ль-'Алиййу-ль-'Азым.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:255"},"sourceDetails":"Сура «аль-Бакара», аят 255.","tags":["защита","коран","величие Аллаха","утро"],"verified":true},{"id":"morning-02-al-ikhlas","category":"morning","order":2,"title":"Сура «аль-Ихляс»","arabic":"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","translation":"Скажи: «Он — Аллах, Единый. Аллах Самодостаточный. Он не родил и не был рождён, и нет никого, равного Ему».","transliteration":"Куль Хуа-Ллаху Ахад. Аллаху-с-Самад. Лям ялид ва лям юляд. Ва лям якуль-ляху куфуван ахад.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"112:1–4"},"sourceDetails":"Сура «аль-Ихляс» полностью.","tags":["коран","единобожие","защита","утро"],"verified":true},{"id":"morning-03-al-falaq","category":"morning","order":3,"title":"Сура «аль-Фаляк»","arabic":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","translation":"Скажи: «Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла дующих на узлы и от зла завистника, когда он завидует».","transliteration":"Куль а'узу би-Рабби-ль-фаляк. Мин шарри ма халяк. Ва мин шарри гасикын иза вакаб. Ва мин шарри-н-наффасати фи-ль-'укад. Ва мин шарри хасидин иза хасад.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"113:1–5"},"sourceDetails":"Сура «аль-Фаляк» полностью.","tags":["коран","защита","сглаз","зависть","утро"],"verified":true},{"id":"morning-04-an-nas","category":"morning","order":4,"title":"Сура «ан-Нас»","arabic":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ","translation":"Скажи: «Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла наущающего, отступающего при поминании Аллаха, который наущает в груди людей, — из джиннов и людей».","transliteration":"Куль а'узу би-Рабби-н-нас. Малики-н-нас. Иляхи-н-нас. Мин шарри-ль-васваси-ль-ханнас. Аллязи ювасвису фи судури-н-нас. Мина-ль-джиннати ва-н-нас.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"114:1–6"},"sourceDetails":"Сура «ан-Нас» полностью.","tags":["коран","защита","наущения","шайтан","утро"],"verified":true},{"id":"morning-05-asbahna-wa-asbaha-l-mulk","category":"morning","order":5,"title":"Мы встретили утро, и власть принадлежит Аллаху","arabic":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","translation":"Мы встретили утро, и вместе с нами утро встретила власть, принадлежащая Аллаху. Хвала Аллаху! Нет божества, кроме одного лишь Аллаха, у Которого нет сотоварища. Ему принадлежит власть, Ему хвала, и Он всё может. Господь мой, прошу Тебя о благе этого дня и о благе того, что за ним, и прибегаю к Тебе от зла этого дня и зла того, что за ним. Господь мой, прибегаю к Тебе от лени и тягот старости. Господь мой, прибегаю к Тебе от мучений в Огне и мучений в могиле.","transliteration":"Асбахна ва асбаха-ль-мульку ли-Лляh, ва-ль-хамду ли-Лляh, ля иляха илля-Ллаху вахдаху ля шарика ляh, ляху-ль-мульку ва ляху-ль-хамду ва Хуа 'аля кулли шайин кадир. Рабби, ас'алюка хайра ма фи хаза-ль-йаум ва хайра ма ба'даh, ва а'узу бика мин шарри ма фи хаза-ль-йаум ва шарри ма ба'даh. Рабби, а'узу бика мина-ль-кясали ва суи-ль-кибар. Рабби, а'узу бика мин 'азабин фи-н-нари ва 'азабин фи-ль-кабр.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"sourceDetails":"Приводится у Муслима в разделе поминаний Аллаха.","tags":["утро","вечер","защита","восхваление","утро"],"verified":false},{"id":"morning-06-allahumma-bika-asbahna","category":"morning","order":6,"title":"О Аллах, с Тобой мы встретили утро","arabic":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ","translation":"О Аллах, с Тобой мы встретили утро и с Тобой встречаем вечер, с Тобой живём и с Тобой умираем, и к Тебе воскрешение.","transliteration":"Аллахумма, бика асбахна, ва бика амсайна, ва бика нахйа, ва бика намуту, ва илейка-н-нушур.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"sourceDetails":"Передаётся также у Абу Дауда и ан-Насаи.","tags":["утро","вечер","упование","утро"],"verified":false},{"id":"morning-07-sayyid-al-istighfar","category":"morning","order":7,"title":"Господин мольб о прощении","arabic":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","translation":"О Аллах, Ты — Господь мой, нет божества, кроме Тебя. Ты создал меня, и я — Твой раб. Я буду верен обещанию, данному Тебе, насколько хватит сил. Прибегаю к Тебе от зла того, что я совершил. Признаю милость, оказанную Тобой мне, и признаю грех свой — прости же меня, ведь никто не прощает грехи, кроме Тебя.","transliteration":"Аллахумма, Анта Рабби, ля иляха илля Ант. Халяктани ва ана 'абдук, ва ана 'аля 'ахдика ва ва'дика ма-стата'т. А'узу бика мин шарри ма сана'т. Абу'у ляка би-ни'матика 'аляййа, ва абу'у би-занби, фа-гфир ли, фа-иннаху ля ягфиру-з-зунуба илля Ант.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари"},"sourceDetails":"Известно как «саййид аль-истигфар» — лучшая форма мольбы о прощении.","tags":["прощение","покаяние","утро","вечер","утро"],"verified":false},{"id":"morning-08-ushhiduka","category":"morning","order":8,"title":"Утром призываю Тебя в свидетели","arabic":"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ","translation":"О Аллах, я встретил утро, призывая в свидетели Тебя, носителей Твоего Трона, Твоих ангелов и всё Твоё творение, что Ты — Аллах, нет божества, кроме Тебя одного, у Тебя нет сотоварища, и что Мухаммад — Твой раб и Твой посланник.","transliteration":"Аллахумма, инни асбахту ушхидука, ва ушхиду хамаляте 'аршика, ва маляикатака ва джами'а халькика, аннака Анта-Ллаху ля иляха илля Анта вахдака ля шарика лак, ва анна Мухаммадан 'абдука ва расулюк.","repetitions":4,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"tags":["свидетельство","единобожие","утро","вечер","утро"],"verified":false},{"id":"morning-09-ma-asbaha-bi-min-nimah","category":"morning","order":9,"title":"Всякая милость этим утром — от Тебя","arabic":"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","translation":"О Аллах, всё, чем Ты одарил меня этим утром или кого-либо из Твоих созданий, — от Тебя одного, у Тебя нет сотоварища. Тебе хвала и Тебе благодарность.","transliteration":"Аллахумма, ма асбаха би мин ни'матин ау би-ахадин мин халькик, фа-минка вахдака ля шарика лак, фа-ляка-ль-хамду ва ляка-ш-шукр.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"tags":["благодарность","милость","утро","вечер","утро"],"verified":false},{"id":"morning-10-hasbiyallahu","category":"morning","order":10,"title":"Достаточно мне Аллаха","arabic":"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","translation":"Достаточно мне Аллаха, нет божества, кроме Него. На Него я уповаю, и Он — Господь великого Трона.","transliteration":"Хасбия-Ллаху ля иляха илля Хуа, 'алейхи таваккальту, ва Хуа Рабби-ль-'арши-ль-'азым.","repetitions":7,"source":{"kind":"quran","collection":"Коран","reference":"9:129"},"sourceDetails":"Текст — часть аята 129 суры «ат-Тауба». Практика семикратного чтения утром и вечером передаётся отдельным преданием.","tags":["упование","защита","коран","трудности","утро"],"verified":false},{"id":"morning-11-bismillahi-lladhi-la-yadurru","category":"morning","order":11,"title":"С именем Аллаха, с именем Которого ничто не причинит вреда","arabic":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ","translation":"С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небе, и Он — Слышащий, Знающий.","transliteration":"Бисми-Лляхи-ллязи ля ядурру ма'а-смихи шайун фи-ль-арди ва ля фи-с-сама, ва Хуа-с-Сами'у-ль-'Алим.","repetitions":3,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"sourceDetails":"Передаётся также у Абу Дауда и Ибн Маджи.","tags":["защита","от вреда","утро","вечер","утро"],"verified":false},{"id":"morning-12-radeetu-billahi","category":"morning","order":12,"title":"Я доволен Аллахом как Господом","arabic":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا","translation":"Я доволен Аллахом как Господом, исламом — как религией и Мухаммадом, мир ему и благословение Аллаха, — как пророком.","transliteration":"Радыту би-Лляхи Раббан, ва би-ль-Ислями динан, ва би-Мухаммадин салля-Ллаху алейхи ва саллям набийян.","repetitions":3,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у ат-Тирмизи и Ахмада.","tags":["довольство","вера","утро","вечер","утро"],"verified":false},{"id":"morning-13-ya-hayyu-ya-qayyum","category":"morning","order":13,"title":"О Живой, о Вечносущий","arabic":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","translation":"О Живой, о Вечносущий! К Твоей милости взываю о помощи. Приведи в порядок все мои дела и не оставляй меня наедине с самим собой даже на мгновение ока.","transliteration":"Йа Хаййу, йа Каййум, би-рахматика астагис. Аслих ли шани куллях, ва ля такильни иля нафси тарфата айн.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ан-Насаи («ас-Сунан аль-кубра»)"},"sourceDetails":"Приводится также у аль-Хакима.","tags":["помощь","упование","трудности","утро","вечер","утро"],"verified":false},{"id":"morning-14-fitrat-al-islam","category":"morning","order":14,"title":"Мы встретили утро в естестве ислама","arabic":"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ","translation":"Мы встретили утро в естестве ислама, со словом искренности, в религии нашего пророка Мухаммада, мир ему и благословение Аллаха, и в вере отца нашего Ибрахима, который был единобожником, предавшимся Аллаху, и не был из числа многобожников.","transliteration":"Асбахна аля фитрати-ль-Ислям, ва аля калимати-ль-ихляс, ва аля дини набиййина Мухаммадин салля-Ллаху алейхи ва саллям, ва аля миллети абина Ибрахима ханифан муслиман ва ма кяна мина-ль-мушрикин.","repetitions":1,"source":{"kind":"hadith","collection":"Муснад Ахмада"},"tags":["вера","единобожие","утро","вечер","утро"],"verified":false},{"id":"morning-15-afini-fi-badani","category":"morning","order":15,"title":"О Аллах, даруй мне благополучие","arabic":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ","translation":"О Аллах, даруй здоровье моему телу. О Аллах, даруй здоровье моему слуху. О Аллах, даруй здоровье моему зрению. Нет божества, кроме Тебя. О Аллах, прибегаю к Тебе от неверия и нищеты и прибегаю к Тебе от мучений в могиле. Нет божества, кроме Тебя.","transliteration":"Аллахумма, 'афини фи бадани. Аллахумма, 'афини фи сам'и. Аллахумма, 'афини фи басари. Ля иляха илля Ант. Аллахумма, инни а'узу бика мина-ль-куфри ва-ль-факр, ва а'узу бика мин 'азаби-ль-кабр. Ля иляха илля Ант.","repetitions":3,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"tags":["здоровье","благополучие","защита","утро","вечер","утро"],"verified":false},{"id":"morning-16-al-afwa-wal-afiyah","category":"morning","order":16,"title":"Прошу у Тебя прощения и благополучия","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ. اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي. اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي. اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","translation":"О Аллах, прошу у Тебя прощения и благополучия в этом мире и в мире вечном. О Аллах, прошу у Тебя прощения и благополучия в моей религии, в моих мирских делах, для моей семьи и моего имущества. О Аллах, прикрой то, что я хочу скрыть, и успокой мои страхи. О Аллах, храни меня спереди и сзади, справа и слева и сверху, и прибегаю к Твоему величию от того, чтобы быть поглощённым снизу.","transliteration":"Аллахумма, инни ас'алюка-ль-'афва ва-ль-'афията фи-д-дунья ва-ль-ахира. Аллахумма, инни ас'алюка-ль-'афва ва-ль-'афията фи дини ва дуньяйа ва ахли ва мали. Аллахумма-стур 'аурати ва амин рау'ати. Аллахумма-хфазни мин байни йадаййа, ва мин хальфи, ва 'ан ямини, ва 'ан шимали, ва мин фауки, ва а'узу би-'азаматика ан угталя мин тахти.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у Ибн Маджи и ан-Насаи.","tags":["защита","благополучие","семья","утро","вечер","утро"],"verified":false},{"id":"morning-17-alima-l-ghayb","category":"morning","order":17,"title":"О Знающий сокровенное и явное","arabic":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ","translation":"О Аллах, Знающий сокровенное и явное, Творец небес и земли, Господь и Владыка всякой вещи! Свидетельствую, что нет божества, кроме Тебя. Прибегаю к Тебе от зла моей души, от зла шайтана и от придаваемых им сотоварищей, от того, чтобы навредить себе или причинить зло мусульманину.","transliteration":"Аллахумма, 'Алима-ль-гайби ва-ш-шахада, Фатыра-с-самавати ва-ль-ард, Рабба кулли шайин ва маликах. Ашхаду ан ля иляха илля Ант. А'узу бика мин шарри нафси, ва мин шарри-ш-шайтани ва ширких, ва ан актарифа 'аля нафси су'ан ау аджурраху иля муслим.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"sourceDetails":"Передаётся также у Абу Дауда.","tags":["защита","шайтан","искренность","утро","вечер","утро"],"verified":false},{"id":"morning-18-subhanallahi-wa-bihamdihi","category":"morning","order":18,"title":"Пречист Аллах и хвала Ему","arabic":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","translation":"Пречист Аллах, и хвала Ему.","transliteration":"Субхана-Ллахи ва би-хамдих.","repetitions":100,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"sourceDetails":"Приводится в обоих «Сахихах» в разделах о поминании Аллаха.","tags":["тасбих","восхваление","утро","вечер","утро"],"verified":false},{"id":"morning-19-la-ilaha-illallah-wahdahu","category":"morning","order":19,"title":"Нет божества, кроме одного лишь Аллаха","arabic":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","translation":"Нет божества, кроме одного лишь Аллаха, у Которого нет сотоварища. Ему принадлежит власть, Ему хвала, и Он всё может.","transliteration":"Ля иляха илля-Ллаху вахдаху ля шарика лях, ляху-ль-мульку ва ляху-ль-хамд, ва Хуа 'аля кулли шайин кадир.","repetitions":10,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"sourceDetails":"В разных преданиях приводится чтение 10 или 100 раз. Здесь выбран вариант в 10 раз.","tags":["единобожие","тахлиль","утро","вечер","утро"],"verified":false},{"id":"morning-20-adada-khalqihi","category":"morning","order":20,"title":"Пречист Аллах числом Его творений","arabic":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ","translation":"Пречист Аллах и хвала Ему — числом Его творений, в меру Его довольства, весом Его Трона и подобно чернилам, которыми записаны Его слова.","transliteration":"Субхана-Ллахи ва би-хамдихи, 'адада хальких, ва рида нафсих, ва зината 'аршихи, ва мидада калиматих.","repetitions":3,"source":{"kind":"hadith","collection":"Сахих Муслим"},"sourceDetails":"Передаётся от Джувайрии, да будет доволен ею Аллах.","tags":["тасбих","восхваление","утро"],"verified":false},{"id":"morning-21-ilman-nafian","category":"morning","order":21,"title":"Прошу у Тебя полезного знания","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا","translation":"О Аллах, прошу у Тебя полезного знания, благого удела и принятого дела.","transliteration":"Аллахумма, инни ас'алюка 'ильман нафи'ан, ва ризкан таййибан, ва 'амалян мутакаббаля.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Ибн Маджи"},"tags":["знание","удел","дела","утро"],"verified":false},{"id":"morning-23-astaghfirullah","category":"morning","order":22,"title":"Прошу прощения у Аллаха и приношу Ему покаяние","arabic":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","translation":"Прошу прощения у Аллаха и приношу Ему покаяние.","transliteration":"Астагфиру-Ллаха ва атубу илейх.","repetitions":100,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["прощение","покаяние","истигфар","утро"],"verified":false},{"id":"morning-24-salawat","category":"morning","order":23,"title":"Мольба о благословении для Пророка ﷺ","arabic":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","translation":"О Аллах, благослови нашего пророка Мухаммада и приветствуй его миром.","transliteration":"Аллахумма, салли ва саллим аля набиййина Мухаммад.","repetitions":10,"source":{"kind":"unknown","collection":"Источник требует уточнения"},"sourceDetails":"Достоинство утреннего и вечернего саляавата передаётся в ряде преданий; конкретный источник требует уточнения.","tags":["салават","пророк","утро"],"verified":false}],"evening":[{"id":"evening-01-ayat-al-kursi","category":"evening","order":1,"title":"Аят аль-Курси","arabic":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","translation":"Аллах — нет божества, кроме Него, Живого, Вечносущего. Не овладевают Им ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто заступится перед Ним без Его дозволения? Он знает их прошлое и их будущее, а они постигают из Его знания лишь то, что Он пожелает. Престол Его объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.","transliteration":"Аллаху ля иляха илля Хуа-ль-Хаййу-ль-Каййум. Ля та'хузуху синатун ва ля наум. Ляху ма фи-с-самавати ва ма фи-ль-ард. Ман заллязи яшфа'у 'индаху илля би-изних. Я'ляму ма байна айдихим ва ма хальфахум, ва ля юхитуна би-шайин мин 'ильмихи илля бима ша'а. Васи'а курсиййуху-с-самавати ва-ль-ард, ва ля я'удуху хифзухума, ва Хуа-ль-'Алиййу-ль-'Азым.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:255"},"sourceDetails":"Сура «аль-Бакара», аят 255.","tags":["защита","коран","величие Аллаха","вечер"],"verified":true},{"id":"evening-02-al-ikhlas","category":"evening","order":2,"title":"Сура «аль-Ихляс»","arabic":"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","translation":"Скажи: «Он — Аллах, Единый. Аллах Самодостаточный. Он не родил и не был рождён, и нет никого, равного Ему».","transliteration":"Куль Хуа-Ллаху Ахад. Аллаху-с-Самад. Лям ялид ва лям юляд. Ва лям якуль-ляху куфуван ахад.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"112:1–4"},"sourceDetails":"Сура «аль-Ихляс» полностью.","tags":["коран","единобожие","защита","вечер"],"verified":true},{"id":"evening-03-al-falaq","category":"evening","order":3,"title":"Сура «аль-Фаляк»","arabic":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","translation":"Скажи: «Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла дующих на узлы и от зла завистника, когда он завидует».","transliteration":"Куль а'узу би-Рабби-ль-фаляк. Мин шарри ма халяк. Ва мин шарри гасикын иза вакаб. Ва мин шарри-н-наффасати фи-ль-'укад. Ва мин шарри хасидин иза хасад.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"113:1–5"},"sourceDetails":"Сура «аль-Фаляк» полностью.","tags":["коран","защита","сглаз","зависть","вечер"],"verified":true},{"id":"evening-04-an-nas","category":"evening","order":4,"title":"Сура «ан-Нас»","arabic":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ","translation":"Скажи: «Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла наущающего, отступающего при поминании Аллаха, который наущает в груди людей, — из джиннов и людей».","transliteration":"Куль а'узу би-Рабби-н-нас. Малики-н-нас. Иляхи-н-нас. Мин шарри-ль-васваси-ль-ханнас. Аллязи ювасвису фи судури-н-нас. Мина-ль-джиннати ва-н-нас.","repetitions":3,"source":{"kind":"quran","collection":"Коран","reference":"114:1–6"},"sourceDetails":"Сура «ан-Нас» полностью.","tags":["коран","защита","наущения","шайтан","вечер"],"verified":true},{"id":"evening-05-asbahna-wa-asbaha-l-mulk","category":"evening","order":5,"title":"Мы встретили вечер, и власть принадлежит Аллаху","arabic":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","translation":"Мы встретили вечер, и вместе с нами вечер встретила власть, принадлежащая Аллаху. Хвала Аллаху! Нет божества, кроме одного лишь Аллаха, у Которого нет сотоварища. Ему принадлежит власть, Ему хвала, и Он всё может. Господь мой, прошу Тебя о благе этой ночи и о благе того, что за ней, и прибегаю к Тебе от зла этой ночи и зла того, что за ней. Господь мой, прибегаю к Тебе от лени и тягот старости. Господь мой, прибегаю к Тебе от мучений в Огне и мучений в могиле.","transliteration":"Амсайна ва амса-ль-мульку ли-Лляh, ва-ль-хамду ли-Лляh, ля иляха илля-Ллаху вахдаху ля шарика ляh, ляху-ль-мульку ва ляху-ль-хамду ва Хуа 'аля кулли шайин кадир. Рабби, ас'алюка хайра ма фи хазихи-ль-лейля ва хайра ма ба'даха, ва а'узу бика мин шарри ма фи хазихи-ль-лейля ва шарри ма ба'даха. Рабби, а'узу бика мина-ль-кясали ва суи-ль-кибар. Рабби, а'узу бика мин 'азабин фи-н-нари ва 'азабин фи-ль-кабр.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"sourceDetails":"Приводится у Муслима в разделе поминаний Аллаха.","tags":["утро","вечер","защита","восхваление","вечер"],"verified":false},{"id":"evening-06-allahumma-bika-asbahna","category":"evening","order":6,"title":"О Аллах, с Тобой мы встретили вечер","arabic":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ","translation":"О Аллах, с Тобой мы встретили вечер и с Тобой встречаем утро, с Тобой живём и с Тобой умираем, и к Тебе возвращение.","transliteration":"Аллахумма, бика амсайна, ва бика асбахна, ва бика нахйа, ва бика намуту, ва илейка-ль-масыр.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"sourceDetails":"Передаётся также у Абу Дауда и ан-Насаи.","tags":["утро","вечер","упование","вечер"],"verified":false},{"id":"evening-07-sayyid-al-istighfar","category":"evening","order":7,"title":"Господин мольб о прощении","arabic":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","translation":"О Аллах, Ты — Господь мой, нет божества, кроме Тебя. Ты создал меня, и я — Твой раб. Я буду верен обещанию, данному Тебе, насколько хватит сил. Прибегаю к Тебе от зла того, что я совершил. Признаю милость, оказанную Тобой мне, и признаю грех свой — прости же меня, ведь никто не прощает грехи, кроме Тебя.","transliteration":"Аллахумма, Анта Рабби, ля иляха илля Ант. Халяктани ва ана 'абдук, ва ана 'аля 'ахдика ва ва'дика ма-стата'т. А'узу бика мин шарри ма сана'т. Абу'у ляка би-ни'матика 'аляййа, ва абу'у би-занби, фа-гфир ли, фа-иннаху ля ягфиру-з-зунуба илля Ант.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари"},"sourceDetails":"Известно как «саййид аль-истигфар» — лучшая форма мольбы о прощении.","tags":["прощение","покаяние","утро","вечер","вечер"],"verified":false},{"id":"evening-08-ushhiduka","category":"evening","order":8,"title":"Вечером призываю Тебя в свидетели","arabic":"اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ","translation":"О Аллах, я встретил вечер, призывая в свидетели Тебя, носителей Твоего Трона, Твоих ангелов и всё Твоё творение, что Ты — Аллах, нет божества, кроме Тебя одного, у Тебя нет сотоварища, и что Мухаммад — Твой раб и Твой посланник.","transliteration":"Аллахумма, инни амсайту ушхидука, ва ушхиду хамаляте 'аршика, ва маляикатака ва джами'а халькика, аннака Анта-Ллаху ля иляха илля Анта вахдака ля шарика лак, ва анна Мухаммадан 'абдука ва расулюк.","repetitions":4,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"tags":["свидетельство","единобожие","утро","вечер","вечер"],"verified":false},{"id":"evening-09-ma-asbaha-bi-min-nimah","category":"evening","order":9,"title":"Всякая милость этим вечером — от Тебя","arabic":"اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","translation":"О Аллах, всё, чем Ты одарил меня этим вечером или кого-либо из Твоих созданий, — от Тебя одного, у Тебя нет сотоварища. Тебе хвала и Тебе благодарность.","transliteration":"Аллахумма, ма амса би мин ни'матин ау би-ахадин мин халькик, фа-минка вахдака ля шарика лак, фа-ляка-ль-хамду ва ляка-ш-шукр.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"tags":["благодарность","милость","утро","вечер","вечер"],"verified":false},{"id":"evening-10-hasbiyallahu","category":"evening","order":10,"title":"Достаточно мне Аллаха","arabic":"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","translation":"Достаточно мне Аллаха, нет божества, кроме Него. На Него я уповаю, и Он — Господь великого Трона.","transliteration":"Хасбия-Ллаху ля иляха илля Хуа, 'алейхи таваккальту, ва Хуа Рабби-ль-'арши-ль-'азым.","repetitions":7,"source":{"kind":"quran","collection":"Коран","reference":"9:129"},"sourceDetails":"Текст — часть аята 129 суры «ат-Тауба». Практика семикратного чтения утром и вечером передаётся отдельным преданием.","tags":["упование","защита","коран","трудности","вечер"],"verified":false},{"id":"evening-11-bismillahi-lladhi-la-yadurru","category":"evening","order":11,"title":"С именем Аллаха, с именем Которого ничто не причинит вреда","arabic":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ","translation":"С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небе, и Он — Слышащий, Знающий.","transliteration":"Бисми-Лляхи-ллязи ля ядурру ма'а-смихи шайун фи-ль-арди ва ля фи-с-сама, ва Хуа-с-Сами'у-ль-'Алим.","repetitions":3,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"sourceDetails":"Передаётся также у Абу Дауда и Ибн Маджи.","tags":["защита","от вреда","утро","вечер","вечер"],"verified":false},{"id":"evening-12-radeetu-billahi","category":"evening","order":12,"title":"Я доволен Аллахом как Господом","arabic":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا","translation":"Я доволен Аллахом как Господом, исламом — как религией и Мухаммадом, мир ему и благословение Аллаха, — как пророком.","transliteration":"Радыту би-Лляхи Раббан, ва би-ль-Ислями динан, ва би-Мухаммадин салля-Ллаху алейхи ва саллям набийян.","repetitions":3,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у ат-Тирмизи и Ахмада.","tags":["довольство","вера","утро","вечер","вечер"],"verified":false},{"id":"evening-13-ya-hayyu-ya-qayyum","category":"evening","order":13,"title":"О Живой, о Вечносущий","arabic":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","translation":"О Живой, о Вечносущий! К Твоей милости взываю о помощи. Приведи в порядок все мои дела и не оставляй меня наедине с самим собой даже на мгновение ока.","transliteration":"Йа Хаййу, йа Каййум, би-рахматика астагис. Аслих ли шани куллях, ва ля такильни иля нафси тарфата айн.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ан-Насаи («ас-Сунан аль-кубра»)"},"sourceDetails":"Приводится также у аль-Хакима.","tags":["помощь","упование","трудности","утро","вечер","вечер"],"verified":false},{"id":"evening-14-fitrat-al-islam","category":"evening","order":14,"title":"Мы встретили вечер в естестве ислама","arabic":"أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ","translation":"Мы встретили вечер в естестве ислама, со словом искренности, в религии нашего пророка Мухаммада, мир ему и благословение Аллаха, и в вере отца нашего Ибрахима, который был единобожником, предавшимся Аллаху, и не был из числа многобожников.","transliteration":"Амсайна аля фитрати-ль-Ислям, ва аля калимати-ль-ихляс, ва аля дини набиййина Мухаммадин салля-Ллаху алейхи ва саллям, ва аля миллети абина Ибрахима ханифан муслиман ва ма кяна мина-ль-мушрикин.","repetitions":1,"source":{"kind":"hadith","collection":"Муснад Ахмада"},"tags":["вера","единобожие","утро","вечер","вечер"],"verified":false},{"id":"evening-15-afini-fi-badani","category":"evening","order":15,"title":"О Аллах, даруй мне благополучие","arabic":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ","translation":"О Аллах, даруй здоровье моему телу. О Аллах, даруй здоровье моему слуху. О Аллах, даруй здоровье моему зрению. Нет божества, кроме Тебя. О Аллах, прибегаю к Тебе от неверия и нищеты и прибегаю к Тебе от мучений в могиле. Нет божества, кроме Тебя.","transliteration":"Аллахумма, 'афини фи бадани. Аллахумма, 'афини фи сам'и. Аллахумма, 'афини фи басари. Ля иляха илля Ант. Аллахумма, инни а'узу бика мина-ль-куфри ва-ль-факр, ва а'узу бика мин 'азаби-ль-кабр. Ля иляха илля Ант.","repetitions":3,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"tags":["здоровье","благополучие","защита","утро","вечер","вечер"],"verified":false},{"id":"evening-16-al-afwa-wal-afiyah","category":"evening","order":16,"title":"Прошу у Тебя прощения и благополучия","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ. اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي. اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي. اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","translation":"О Аллах, прошу у Тебя прощения и благополучия в этом мире и в мире вечном. О Аллах, прошу у Тебя прощения и благополучия в моей религии, в моих мирских делах, для моей семьи и моего имущества. О Аллах, прикрой то, что я хочу скрыть, и успокой мои страхи. О Аллах, храни меня спереди и сзади, справа и слева и сверху, и прибегаю к Твоему величию от того, чтобы быть поглощённым снизу.","transliteration":"Аллахумма, инни ас'алюка-ль-'афва ва-ль-'афията фи-д-дунья ва-ль-ахира. Аллахумма, инни ас'алюка-ль-'афва ва-ль-'афията фи дини ва дуньяйа ва ахли ва мали. Аллахумма-стур 'аурати ва амин рау'ати. Аллахумма-хфазни мин байни йадаййа, ва мин хальфи, ва 'ан ямини, ва 'ан шимали, ва мин фауки, ва а'узу би-'азаматика ан угталя мин тахти.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Передаётся также у Ибн Маджи и ан-Насаи.","tags":["защита","благополучие","семья","утро","вечер","вечер"],"verified":false},{"id":"evening-17-alima-l-ghayb","category":"evening","order":17,"title":"О Знающий сокровенное и явное","arabic":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ","translation":"О Аллах, Знающий сокровенное и явное, Творец небес и земли, Господь и Владыка всякой вещи! Свидетельствую, что нет божества, кроме Тебя. Прибегаю к Тебе от зла моей души, от зла шайтана и от придаваемых им сотоварищей, от того, чтобы навредить себе или причинить зло мусульманину.","transliteration":"Аллахумма, 'Алима-ль-гайби ва-ш-шахада, Фатыра-с-самавати ва-ль-ард, Рабба кулли шайин ва маликах. Ашхаду ан ля иляха илля Ант. А'узу бика мин шарри нафси, ва мин шарри-ш-шайтани ва ширких, ва ан актарифа 'аля нафси су'ан ау аджурраху иля муслим.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан ат-Тирмизи"},"sourceDetails":"Передаётся также у Абу Дауда.","tags":["защита","шайтан","искренность","утро","вечер","вечер"],"verified":false},{"id":"evening-18-subhanallahi-wa-bihamdihi","category":"evening","order":18,"title":"Пречист Аллах и хвала Ему","arabic":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","translation":"Пречист Аллах, и хвала Ему.","transliteration":"Субхана-Ллахи ва би-хамдих.","repetitions":100,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"sourceDetails":"Приводится в обоих «Сахихах» в разделах о поминании Аллаха.","tags":["тасбих","восхваление","утро","вечер","вечер"],"verified":false},{"id":"evening-19-la-ilaha-illallah-wahdahu","category":"evening","order":19,"title":"Нет божества, кроме одного лишь Аллаха","arabic":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","translation":"Нет божества, кроме одного лишь Аллаха, у Которого нет сотоварища. Ему принадлежит власть, Ему хвала, и Он всё может.","transliteration":"Ля иляха илля-Ллаху вахдаху ля шарика лях, ляху-ль-мульку ва ляху-ль-хамд, ва Хуа 'аля кулли шайин кадир.","repetitions":10,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"sourceDetails":"В разных преданиях приводится чтение 10 или 100 раз. Здесь выбран вариант в 10 раз.","tags":["единобожие","тахлиль","утро","вечер","вечер"],"verified":false},{"id":"evening-22-kalimat-allah-at-tammat","category":"evening","order":20,"title":"Прибегаю к совершенным словам Аллаха","arabic":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","translation":"Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил.","transliteration":"А'узу би-калимати-Лляхи-т-таммати мин шарри ма халяк.","repetitions":3,"source":{"kind":"hadith","collection":"Сахих Муслим"},"sourceDetails":"Передаётся как вечернее поминание.","tags":["защита","от вреда","вечер"],"verified":false},{"id":"evening-23-astaghfirullah","category":"evening","order":21,"title":"Прошу прощения у Аллаха и приношу Ему покаяние","arabic":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","translation":"Прошу прощения у Аллаха и приношу Ему покаяние.","transliteration":"Астагфиру-Ллаха ва атубу илейх.","repetitions":100,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["прощение","покаяние","истигфар","вечер"],"verified":false},{"id":"evening-24-salawat","category":"evening","order":22,"title":"Мольба о благословении для Пророка ﷺ","arabic":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","translation":"О Аллах, благослови нашего пророка Мухаммада и приветствуй его миром.","transliteration":"Аллахумма, салли ва саллим аля набиййина Мухаммад.","repetitions":10,"source":{"kind":"unknown","collection":"Источник требует уточнения"},"sourceDetails":"Достоинство утреннего и вечернего саляавата передаётся в ряде преданий; конкретный источник требует уточнения.","tags":["салават","пророк","вечер"],"verified":false}],"after-prayer":[{"id":"after-prayer-01-astaghfirullah","category":"after-prayer","order":1,"title":"Прошу прощения у Аллаха","arabic":"أَسْتَغْفِرُ اللَّهَ","translation":"Прошу прощения у Аллаха.","transliteration":"Астагфиру-Ллах.","repetitions":3,"source":{"kind":"hadith","collection":"Сахих Муслим"},"sourceDetails":"Читается сразу после завершения намаза.","tags":["прощение","после намаза","истигфар"],"verified":false},{"id":"after-prayer-02-anta-s-salam","category":"after-prayer","order":2,"title":"О Аллах, Ты — Мир","arabic":"اللَّهُمَّ أَنْتَ السَّلَامُ، وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ","translation":"О Аллах, Ты — Мир, и от Тебя мир. Благословен Ты, о Обладатель величия и щедрости.","transliteration":"Аллахумма, Анта-с-Салям, ва минка-с-салям, табаракта йа За-ль-Джаляли ва-ль-Икрам.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"tags":["после намаза","восхваление"],"verified":false},{"id":"after-prayer-03-la-mania-lima-atayta","category":"after-prayer","order":3,"title":"Никто не удержит того, что Ты даровал","arabic":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ","translation":"Нет божества, кроме одного лишь Аллаха, у Которого нет сотоварища. Ему принадлежит власть, Ему хвала, и Он всё может. О Аллах, никто не удержит того, что Ты даровал, и никто не дарует того, что Ты удержал, и не принесёт пользы обладателю богатства его богатство перед Тобой.","transliteration":"Ля иляха илля-Ллаху вахдаху ля шарика лях, ляху-ль-мульку ва ляху-ль-хамд, ва Хуа 'аля кулли шайин кадир. Аллахумма, ля мани'а лима а'тайт, ва ля му'тыя лима мана'т, ва ля янфа'у за-ль-джадди минка-ль-джадд.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["после намаза","единобожие","удел"],"verified":false},{"id":"after-prayer-04-la-hawla-wa-la-quwwata","category":"after-prayer","order":4,"title":"Нет силы и мощи ни у кого, кроме Аллаха","arabic":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، لَا إِلَهَ إِلَّا اللَّهُ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ","translation":"Нет божества, кроме одного лишь Аллаха, у Которого нет сотоварища. Ему принадлежит власть, Ему хвала, и Он всё может. Нет силы и мощи ни у кого, кроме Аллаха. Нет божества, кроме Аллаха, и мы не поклоняемся никому, кроме Него. Ему принадлежат милость, щедрость и прекрасная хвала. Нет божества, кроме Аллаха, и мы искренни перед Ним в религии, даже если это ненавистно неверующим.","transliteration":"Ля иляха илля-Ллаху вахдаху ля шарика лях, ляху-ль-мульку ва ляху-ль-хамд, ва Хуа 'аля кулли шайин кадир. Ля хауля ва ля куввата илля би-Лляh. Ля иляха илля-Ллах, ва ля на'буду илля иййаh. Ляху-н-ни'мату ва ляху-ль-фадлу ва ляху-с-санау-ль-хасан. Ля иляха илля-Ллаху мухлисына ляху-д-дина ва ляу кариха-ль-кяфирун.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"tags":["после намаза","единобожие","искренность"],"verified":false},{"id":"after-prayer-05-tasbih","category":"after-prayer","order":5,"title":"Пречист Аллах","arabic":"سُبْحَانَ اللَّهِ","translation":"Пречист Аллах.","transliteration":"Субхана-Ллах.","repetitions":33,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"sourceDetails":"Часть поминания после намаза: 33 + 33 + 33 и завершающая формула.","tags":["после намаза","тасбих"],"verified":false},{"id":"after-prayer-06-tahmid","category":"after-prayer","order":6,"title":"Хвала Аллаху","arabic":"الْحَمْدُ لِلَّهِ","translation":"Хвала Аллаху.","transliteration":"Аль-хамду ли-Лляh.","repetitions":33,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["после намаза","хвала"],"verified":false},{"id":"after-prayer-07-takbir","category":"after-prayer","order":7,"title":"Аллах велик","arabic":"اللَّهُ أَكْبَرُ","translation":"Аллах велик.","transliteration":"Аллаху акбар.","repetitions":33,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["после намаза","такбир"],"verified":false},{"id":"after-prayer-08-tamam-al-mia","category":"after-prayer","order":8,"title":"Завершение сотни","arabic":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","translation":"Нет божества, кроме одного лишь Аллаха, у Которого нет сотоварища. Ему принадлежит власть, Ему хвала, и Он всё может.","transliteration":"Ля иляха илля-Ллаху вахдаху ля шарика лях, ляху-ль-мульку ва ляху-ль-хамд, ва Хуа 'аля кулли шайин кадир.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих Муслим"},"sourceDetails":"Читается сотым после трёх наборов по 33 раза.","tags":["после намаза","единобожие"],"verified":false},{"id":"after-prayer-09-ayat-al-kursi","category":"after-prayer","order":9,"title":"Аят аль-Курси","arabic":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","translation":"Аллах — нет божества, кроме Него, Живого, Вечносущего. Не овладевают Им ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто заступится перед Ним без Его дозволения? Он знает их прошлое и их будущее, а они постигают из Его знания лишь то, что Он пожелает. Престол Его объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.","transliteration":"Аллаху ля иляха илля Хуа-ль-Хаййу-ль-Каййум. Ля та'хузуху синатун ва ля наум. Ляху ма фи-с-самавати ва ма фи-ль-ард. Ман заллязи яшфа'у 'индаху илля би-изних. Я'ляму ма байна айдихим ва ма хальфахум, ва ля юхитуна би-шайин мин 'ильмихи илля бима ша'а. Васи'а курсиййуху-с-самавати ва-ль-ард, ва ля я'удуху хифзухума, ва Хуа-ль-'Алиййу-ль-'Азым.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"2:255"},"sourceDetails":"Сура «аль-Бакара», аят 255.","tags":["после намаза","защита","коран"],"verified":true},{"id":"after-prayer-10-al-ikhlas","category":"after-prayer","order":10,"title":"Сура «аль-Ихляс»","arabic":"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","translation":"Скажи: «Он — Аллах, Единый. Аллах Самодостаточный. Он не родил и не был рождён, и нет никого, равного Ему».","transliteration":"Куль Хуа-Ллаху Ахад. Аллаху-с-Самад. Лям ялид ва лям юляд. Ва лям якуль-ляху куфуван ахад.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"112:1–4"},"sourceDetails":"Сура «аль-Ихляс» полностью.","tags":["после намаза","коран","защита"],"verified":true},{"id":"after-prayer-11-al-falaq","category":"after-prayer","order":11,"title":"Сура «аль-Фаляк»","arabic":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","translation":"Скажи: «Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла дующих на узлы и от зла завистника, когда он завидует».","transliteration":"Куль а'узу би-Рабби-ль-фаляк. Мин шарри ма халяк. Ва мин шарри гасикын иза вакаб. Ва мин шарри-н-наффасати фи-ль-'укад. Ва мин шарри хасидин иза хасад.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"113:1–5"},"sourceDetails":"Сура «аль-Фаляк» полностью.","tags":["после намаза","коран","защита"],"verified":true},{"id":"after-prayer-12-an-nas","category":"after-prayer","order":12,"title":"Сура «ан-Нас»","arabic":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ","translation":"Скажи: «Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла наущающего, отступающего при поминании Аллаха, который наущает в груди людей, — из джиннов и людей».","transliteration":"Куль а'узу би-Рабби-н-нас. Малики-н-нас. Иляхи-н-нас. Мин шарри-ль-васваси-ль-ханнас. Аллязи ювасвису фи судури-н-нас. Мина-ль-джиннати ва-н-нас.","repetitions":1,"source":{"kind":"quran","collection":"Коран","reference":"114:1–6"},"sourceDetails":"Сура «ан-Нас» полностью.","tags":["после намаза","коран","защита"],"verified":true},{"id":"after-prayer-13-ainni-ala-dhikrika","category":"after-prayer","order":13,"title":"Помоги мне поминать Тебя","arabic":"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ","translation":"О Аллах, помоги мне поминать Тебя, благодарить Тебя и поклоняться Тебе наилучшим образом.","transliteration":"Аллахумма, а'инни 'аля зикрика, ва шукрика, ва хусни 'ибадатик.","repetitions":1,"source":{"kind":"hadith","collection":"Сунан Абу Дауда"},"sourceDetails":"Пророк ﷺ советовал не оставлять эту мольбу после каждого намаза.","tags":["после намаза","поминание","благодарность"],"verified":false}],"sleep":[{"id":"sleep-01-bismika-amutu-wa-ahya","category":"sleep","order":1,"title":"С именем Твоим я умираю и оживаю","arabic":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","translation":"С именем Твоим, о Аллах, я умираю и оживаю.","transliteration":"Бисмика-Ллахумма амуту ва ахйа.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари"},"tags":["сон","перед сном"],"verified":false},{"id":"sleep-02-wadatu-janbi","category":"sleep","order":2,"title":"С именем Твоим, Господь мой, я лёг на бок","arabic":"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ","translation":"С именем Твоим, Господь мой, я лёг на бок и с Твоей помощью поднимусь. Если Ты заберёшь мою душу — помилуй её, а если отпустишь — храни её так, как хранишь Своих праведных рабов.","transliteration":"Бисмика, Рабби, вада'ту джанби, ва бика арфа'ух. Фа-ин амсакта нафси фа-рхамха, ва ин арсальтаха фа-хфазха бима тахфазу бихи 'ибадака-с-салихин.","repetitions":1,"source":{"kind":"hadith","collection":"Сахих аль-Бухари и Сахих Муслим"},"tags":["сон","перед сном","защита"],"verified":false},{"id":"sleep-03-aslamtu-nafsi","category":"sleep","order":3,"title":"Я предал себя Тебе","arabic":"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ","translation":"О Аллах, я предал себя Тебе, вверил Тебе своё дело, обратил к Тебе своё лицо и на Тебя положился — со стремлением к Тебе и
