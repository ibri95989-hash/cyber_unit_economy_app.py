[theme]
base = "dark"
primaryColor = "#0a84ff"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0e0e10"
textColor = "#f5f5f7"
font = "sans serif"

[server]
headless = true

[browser]
# Панель работает с данными кабинета — телеметрия здесь лишняя.
gatherUsageStats = false

[client]
# Прячем кнопку Deploy: в панели с ключами Ozon один случайный клик по ней
# выложил бы форму ввода ключей на публичный адрес.
toolbarMode = "minimal"
